# `docker compose up --build` runs the app at http://localhost:8080: frontend (nginx + React) in front, backend (API) behind it.
# The database is the shared Cloud SQL one named by DATABASE_URL in backend/.env. Inside a container 127.0.0.1 is the
# container itself, so if that URL points at a Cloud SQL proxy on your machine, write host.docker.internal instead.
# For a throwaway local database instead: `docker compose --profile local-db up --build` with
# DATABASE_URL=postgres://hr:hr@db:5432/hrhub in backend/.env.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Same settings as running it locally (see backend/.env.example); the lines below override what differs in Docker.
    env_file:
      - path: backend/.env
        required: false
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hrhub-uploads:/srv/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    profiles: ["local-db"]
    image: postgres:16
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: hrhub
    ports:
      - "5432:5432"
    volumes:
      - hrhub-data:/var/lib/postgresql/data

volumes:
  hrhub-data:
  hrhub-uploads:
