  </tbody></table></div></div></section>`;
}

function vAudit(){
  const f=S.af;
  const rows=S.audit.filter(a=>(!f.q||(a.emp+a.action+a.actor).toLowerCase().includes(f.q.toLowerCase()))&&(!f.app||a.app===f.app)&&(!f.res||a.result===f.res));
  return `<section class="section">
  ${head("Compliance","Audit <span class=\"grad\">log.</span>","Every access change, who made it and whether it worked. Entries can't be edited or deleted.",`<button class="btn glass" data-proto="CSV export">Export CSV</button>`,true)}
  <div class="card"><div class="filters">
    <input class="input grow" id="af-q" placeholder="Filter by person or action" value="${esc(f.q)}" aria-label="Filter by person or action">
    <select class="input" id="af-app" aria-label="Tool"><option value="">All tools</option>${APPS.map(a=>`<option value="${a.id}" ${f.app===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select>
    <select class="input" id="af-res" aria-label="Result"><option value="">All results</option><option value="ok" ${f.res==="ok"?"selected":""}>Succeeded</option><option value="fail" ${f.res==="fail"?"selected":""}>Failed</option><option value="info" ${f.res==="info"?"selected":""}>Scheduled</option></select>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>When</th><th>Employee</th><th>Tool</th><th>Action</th><th class="hide-sm">By</th><th>Result</th></tr></thead><tbody>
  ${rows.length?rows.map(a=>`<tr><td class="num-cell mono">${fts(a.ts)}</td><td style="white-space:nowrap">${esc(a.emp)}</td><td>${a.app?`<div class="person">${appIc(a.app)}<span class="hide-sm" style="font-size:14px;color:var(--ink)">${esc(APP[a.app].name)}</span></div>`:`<span class="muted">—</span>`}</td><td style="min-width:200px">${esc(a.action)}</td><td class="hide-sm" style="white-space:nowrap">${esc(a.actor)}</td><td>${a.result==="fail"?'<span class="pill p-bad">Failed</span>':a.result==="info"?'<span class="pill p-warn">Scheduled</span>':'<span class="pill p-ok">Done</span>'}</td></tr>`).join("")
  :`<tr><td colspan="6"><div class="empty">No entries match these filters.</div></td></tr>`}
  </tbody></table></div></div></section>`;
}

/* ---------- render ---------- */
/* Simulated clock: the demo day moves on from the fixed start time. */
/* Activates any work email that was created ahead of time once the joining date has arrived. */
function activateDue(){
  let n=0;
  for(const e of S.emps) if(e.grants.gws==="created"&&e.start&&e.start<=todayIso()){
    e.grants.gws="active"; log(`Work email activated on the joining date (${fdate(e.start)})`,e,"gws","ok"); settle(e); n++;
  }
  return n;
}
const activationNote=start=>!start?"":start>todayIso()
  ?`The account is created when you submit and stays suspended until the joining date (${fdate(start)}). It then activates automatically. HR can activate it early from the employee page.`
  :`The joining date (${fdate(start)}) has already passed, so the account is activated as soon as it is created.`;
function render(){
  if(activateDue()) toast("A work email was activated on its joining date.");
  if(!routeAllowed(S.route)) S.route=isEmployee()?"docs":"dashboard";
  if(S.route==="users"&&!S.users&&!S.usersBusy) loadUsers();
  renderNav();
  const v={dashboard:vDashboard,employees:vEmployees,employee:vEmployee,onboard:vOnboard,docs:vDocs,offboard:vOffboard,myleave:vMyLeave,leave:vLeave,templates:vTemplates,audit:vAudit,users:vUsers,account:vAccount}[S.route]||vDashboard;
  $("#view").innerHTML=v();
}
function soft(){ if(S.route!=="onboard") render(); else renderNav(); }

/* ---------- actions ---------- */
async function provision(e,ids){
  for(const id of ids){
    e.grants[id]="provisioning"; soft(); await sleep(650);
    const wait=id==="gws"&&e.start&&e.start>todayIso();   // work email: create now, activate on the joining date
    e.grants[id]=wait?"created":"active"; delete e.errors[id];
    log(wait?`Work email created, suspended until the joining date (${fdate(e.start)})`:{gws:"Account created and activated",gemini:"Licence assigned",claude:"Invite sent",github:"Added to org and team",gcp:"IAM role granted on wohlig-dev"}[id],e,id,"ok");
    soft(); await sleep(150);
  }
  settle(e); soft();
}
async function revoke(e,to){
  e.status="offboarding"; e.offTasks=OFF_TASKS.map(t=>({t,done:false}));
  log("Offboarding started",e,null,"ok");
  const order=Object.keys(e.grants).filter(k=>e.grants[k]!=="none"&&e.grants[k]!=="revoked").sort((a,b)=>(a==="gws"?-1:b==="gws"?1:0));
  soft();
  for(const id of order){
    e.grants[id]="revoking"; soft(); await sleep(650);
    e.grants[id]="revoked"; delete e.errors[id];
    log(id==="gws"?`Account suspended, Drive and email moved to ${to}`:id==="gemini"?"Licence removed":id==="gcp"?"IAM roles removed":"Access removed",e,id,"ok");
    soft(); await sleep(150);
  }
  toast(`All tool access removed for ${e.name}. Finish the manual tasks to close it out.`);
  soft();
}

function modal(html){const l=$("#layer");const d=document.createElement("div");d.className="scrim";d.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;l.appendChild(d);d.addEventListener("click",ev=>{if(ev.target===d||ev.target.closest("[data-close]"))d.remove()});const b=d.querySelector("[data-ok]");b&&b.focus();return d}

/* Edit details: one audit row per save that changes something, listing each field old → new. */
function editEmployee(e){
  const F=[["name","Full name","text"],["email","Work email","email"],["title","Job title","text"],["start","Date of joining","date"]];
  const m=modal(`<form id="edf" novalidate><div class="card-h" style="padding-top:24px"><h3>Edit ${esc(e.name)}</h3></div><div class="card-b">
    ${F.map(([k,l,ty])=>`<div class="field"><label for="e-${k}">${l}</label><input class="input${k==="email"?" mono":""}" id="e-${k}" type="${ty}" value="${esc(e[k]==="—"?"":e[k]||"")}" ${k==="email"?`data-id="${e.id}" aria-describedby="e-email-err" aria-invalid="false"`:""}>${k==="email"?`<span class="ferr" id="e-email-err" role="alert" hidden></span>`:""}</div>`).join("")}
    <div class="field"><label for="e-dept">Department</label><select class="input" id="e-dept">${Object.keys(DEPT_TPL).map(d=>`<option ${d===e.dept?"selected":""}>${d}</option>`).join("")}</select></div>
    <div class="muted" style="font-size:13px">Saving adds one row to the audit log with what changed.</div></div>
    <div class="modal-f"><button type="button" class="btn glass" data-close>Cancel</button><button type="submit" class="btn primary" data-ok>Save changes</button></div></form>`);
  m.querySelector("#edf").addEventListener("submit",ev=>{
    ev.preventDefault();
    const v={name:$("#e-name").value.trim(),email:$("#e-email").value.trim().toLowerCase(),title:$("#e-title").value.trim()||"—",start:$("#e-start").value,dept:$("#e-dept").value};
    if(!v.name){$("#e-name").focus();toast("Add the employee's full name.");return}
    const bad=emailProblem(v.email,e.id); if(bad){showEmailError("e-email",bad);$("#e-email").focus();return}
    const label={name:"Name",email:"Work email",title:"Job title",start:"Date of joining",dept:"Department"};
    const diff=Object.keys(v).filter(k=>(e[k]||"")!==v[k]);
    if(!diff.length){m.remove();toast("No changes to save.");return}
    const what=diff.map(k=>`${label[k]}: ${k==="start"?fdate(e[k]):e[k]||"—"} → ${k==="start"?fdate(v[k]):v[k]}`).join("; ");
    diff.forEach(k=>e[k]=v[k]);
    log(`Details edited. ${what}`,e,null,"ok");
    m.remove(); toast(`Saved changes for ${e.name}.`); render();
  });
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-go],[data-emp],[data-retry],[data-provision],[data-offboard],[data-confirmoff],[data-proto],[data-edit],[data-lv],[data-activate],[data-offrun],[data-offcancel]"); if(!t) return;
  if(t.dataset.activate){const e=S.emps.find(x=>x.id==t.dataset.activate);if(e&&e.grants.gws==="created"){e.grants.gws="active";log("Work email activated early by HR",e,"gws","ok");settle(e);toast(`${e.email} is now active.`);render()}return}
  if(t.dataset.lv){lvAction(t.dataset.lv);return}
  if(t.dataset.edit){editEmployee(S.emps.find(x=>x.id==t.dataset.edit));return}
  if(t.dataset.go){ev.preventDefault();go(t.dataset.go);return}
  if(t.dataset.emp){go("employee",Number(t.dataset.emp));return}
  if(t.dataset.retry){const [eid,app]=t.dataset.retry.split(":");const e=S.emps.find(x=>x.id==eid);log("Retry requested",e,app,"info");
    if(e.status==="offboarding"){ if(S.off.online&&e.offId){offCall("POST",`/api/offboarding/${e.offId}/steps/${app}/retry`).then(r=>{toast(r.ok?(e.grants[app]==="revoked"?`${APP[app].name} access removed.`:`${APP[app].name} failed again.`):r.error);render()})}
      else{e.grants[app]="revoked";delete e.errors[app];log("Access removed",e,app,"ok");settle(e);render()} return}
    provision(e,[app]);return}
  if(t.dataset.offrun){const e=S.emps.find(x=>x.id==t.dataset.offrun);
    if(S.off.online){offCall("POST",`/api/offboarding/${e.offId}/run`).then(r=>{if(!r.ok)return toast(r.error);log("Access removed early by HR",e,null,"ok");toast(`Access removed for ${e.name}.`);render()})}
    else{const to=e.offSched.to;e.offSched=null;revoke(e,to)} return}
  if(t.dataset.offcancel){const e=S.emps.find(x=>x.id==t.dataset.offcancel);
    const done=()=>{e.offId=null;e.offRec=null;e.offSched=null;e.lastDay=undefined;e.offTasks=null;log("Scheduled offboarding called off",e,null,"info");toast(`Offboarding for ${e.name} called off.`);render()};
    if(S.off.online){offCall("POST",`/api/offboarding/${e.offId}/cancel`).then(r=>r.ok?done():toast(r.error))}else done(); return}
  if(t.dataset.provision){const e=S.emps.find(x=>x.id==t.dataset.provision);provision(e,Object.keys(e.grants).filter(k=>e.grants[k]==="none"));return}
  if(t.dataset.offboard){S.offSel=Number(t.dataset.offboard);go("offboard");return}
  if(t.dataset.proto){toast(`${t.dataset.proto} is part of the full build. This prototype shows the flow only.`);return}
  if(t.dataset.confirmoff){
    const e=S.emps.find(x=>x.id==t.dataset.confirmoff);
    const to=$("#o-to")?.value||e.manager; const day=$("#o-day")?.value; const later=$("#o-later")?.checked;
    const live=Object.keys(e.grants).filter(k=>["active","failed","created"].includes(e.grants[k]));
    const m=modal(`<div class="card-h" style="padding-top:24px"><h3>${later?"Schedule":"Offboard"} ${esc(e.name)}?</h3></div><div class="card-b">
      <div class="callout bad">${svg("alert")}<div>${later?`On <b>${esc(fdate(day))}</b> at 6:00 pm, `:""}${esc(e.name.split(" ")[0])} will lose access to <b>${live.length} tools</b>${later?"":" right away"}. Their Drive files and email go to <b>${esc(to)}</b>.</div></div>
      <div class="chips">${live.map(id=>`<span class="chip">${appIc(id)}${esc(APP[id].name)}</span>`).join("")}</div>
      <div class="muted" style="font-size:13px">Every step is written to the audit log. A suspended Google account can be restored for 20 days.</div></div>
      <div class="modal-f"><button class="btn glass" data-close>Cancel</button><button class="btn danger" data-ok>${later?"Schedule offboarding":"Yes, remove all access"}</button></div>`);
    m.querySelector("[data-ok]").addEventListener("click",async()=>{
      m.remove();
      if(S.off.online){
        const res=await offCall("POST","/api/offboarding",{email:e.email,lastDay:day,transferTo:transferEmail(to),when:later?"later":"now",tools:live});
        if(!res.ok){toast(res.error);return}
        log(later?`Offboarding scheduled for ${fdate(day)}, 6:00 pm`:"Offboarding started",e,null,later?"info":"ok");
        S.offSel=null; toast(later?`Offboarding for ${e.name} scheduled for ${fdate(day)}.`:`Access removed for ${e.name}. Finish the manual tasks to close it out.`);
        go("employee",e.id); return;
      }
      leaveAfter(e,day).forEach(r=>{r.status="cancelled"});
      if(later){e.lastDay=day;e.offSched={to};log(`Offboarding scheduled for ${fdate(day)}`,e,null,"info");toast(`Offboarding for ${e.name} scheduled for ${fdate(day)}`);go("employee",e.id)}
      else{e.lastDay=day;S.offSel=null;go("employee",e.id);revoke(e,to)}
    });
  }
});

document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.task&&t.dataset.task.split(":")[1]==="off"&&S.off.online){const [eid,,i]=t.dataset.task.split(":");const e=S.emps.find(x=>x.id==eid);const k=e.offTasks[i];
    offCall("POST",`/api/offboarding/${e.offId}/steps/${k.key}`,{done:t.checked}).then(r=>{if(!r.ok)toast(r.error);else{log(`Checklist: ${k.t}${t.checked?"":" (unticked)"}`,e,null,"ok");if(e.status==="offboarded")toast(`${e.name} is fully offboarded`)}render()});return}
  if(t.dataset.task){const [eid,ph,i]=t.dataset.task.split(":");const e=S.emps.find(x=>x.id==eid);const list=ph==="on"?e.onTasks:e.offTasks;list[i].done=t.checked;log(`Checklist: ${list[i].t}${t.checked?"":" (unticked)"}`,e,null,"ok");settle(e);render();return}
  if(t.name==="offsel"){S.offSel=Number(t.value);render();return}
  if(t.id==="o-day"){const e=S.emps.find(x=>x.id===S.offSel);if(e)$("#o-settle").innerHTML=settlementHtml(e,t.value,true);return}
  if(t.id==="f-dept"){const tid=DEPT_TPL[t.value];$("#tpl-name").textContent="Bundle: "+TEMPLATES.find(x=>x.id===tid).name;APPS.forEach(a=>{$("#app-"+a.id).checked=T(tid).includes(a.id)});return}
  if(t.id==="me-pick"){S.me=t.value;try{localStorage.setItem(ME_KEY,t.value)}catch(e){}render();return}
  if(t.id==="lv-month"){S.lvUi.month=t.value||lvToday().slice(0,7);render();return}
  if(t.id==="af-app"||t.id==="af-res"){S.af={q:$("#af-q").value,app:$("#af-app").value,res:$("#af-res").value};render();return}
});
function keepFocus(id){const n=$("#"+id);const pos=n.selectionStart;return()=>{const m=$("#"+id);if(m){m.focus();m.setSelectionRange(pos,pos)}}}
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="f-name"){const m=$("#f-email");if(!m.dataset.touched){m.value=t.value.trim()?mail(t.value):"";showEmailError("f-email",m.value&&emailTaken(m.value)?emailProblem(m.value):"")}}
  if(t.id==="f-email"){t.dataset.touched="1";showEmailError("f-email",emailTaken(t.value)?emailProblem(t.value):"")}
  if(t.id==="e-email"){showEmailError("e-email",emailTaken(t.value,Number(t.dataset.id))?emailProblem(t.value,Number(t.dataset.id)):"")}
  if(t.id==="af-q"){S.af={q:t.value,app:$("#af-app").value,res:$("#af-res").value};const r=keepFocus("af-q");render();r()}
  if(t.id==="q"){S.q=t.value;const r=keepFocus("q");render();r()}
  if(t.id==="lv-q"){S.lvUi.q=t.value;const r=keepFocus("lv-q");render();r()}
});
document.addEventListener("submit",ev=>{
  if(ev.target.id!=="onf") return; ev.preventDefault();
  const name=$("#f-name").value.trim(); if(!name){$("#f-name").focus();toast("Add the employee's full name first.");return}
  const apps=[...document.querySelectorAll("#f-apps input:checked")].map(i=>i.value);
  const email=$("#f-email").value.trim().toLowerCase(), bad=emailProblem(email);
  if(bad){showEmailError("f-email",bad);$("#f-email").focus();toast(bad);return}
  if(!apps.length){toast("Pick at least one tool to give.");return}
  const e=mk({name,dept:$("#f-dept").value,title:$("#f-title").value.trim()||"—",manager:$("#f-mgr").value,start:$("#f-start").value,status:"onboarding",
    grants:all(apps,"none"),onTasks:ON_TASKS.map(t=>({t,done:false}))});
  e.color=AV[S.emps.length%AV.length]; e.email=email;
  S.emps.push(e); log(`Employee record created (${email})`,e,null,"ok");
  go("employee",e.id); provision(e,apps);
});

try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ let t=null; try{t=localStorage.getItem(THEME_KEY)}catch(e){} if(!t) applyTheme(theme()); }); }catch(e){}
applyTheme(theme());
boot().then(()=>{ lvLoad(); if(!isEmployee()) offLoad(); });
})();
