<title>HR Access Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: wohlig.com language. Floating glass pill nav, centred serif hero with glass stat cards,
   then left-aligned sections (eyebrow + serif heading + smile underline) on lavender "smoke" paper.
   Light and dark themes: follows the system setting until the user picks one with the toggle. */
:root{
  color-scheme:light;
  --surface:#fff; --surface-2:rgba(255,255,255,.75); --surface-3:rgba(255,255,255,.85); --tint:#eceeff; --tint-2:#f1f2ff; --card-edge:rgba(255,255,255,.9); --toast-fg:#fff;
  --tile-grad:linear-gradient(135deg,#eef0ff,#e3e6ff); --callout:rgba(236,238,255,.85);
  --blob1:rgba(169,187,255,.45); --blob2:rgba(198,205,255,.55); --blob3:rgba(189,238,226,.38); --blob4:rgba(220,200,255,.35);
  --paper:#fdfcff; --paper-2:#f5f5fe; --ink:#0e0a38; --ink-dim:#555177; --ink-faint:#7c7aa0;
  --purple:#4254d4; --purple-deep:#3242b2; --purple-soft:#7d8cee; --lilac:#c6cdff; --periwinkle:#a9bbff; --mint:#bdeee2;
  --line:rgba(77,73,221,.12); --line-2:rgba(77,73,221,.22);
  --ok:#14794a; --ok-soft:#e1f5ec; --warn:#9a5a07; --warn-soft:#fdf1dc; --bad:#c0352b; --bad-soft:#fdeceb;
  --grad-accent:linear-gradient(110deg,var(--purple) 10%,var(--purple-soft) 55%,var(--periwinkle));
  --grad-btn:linear-gradient(135deg,#7d8cee -20%,#4254d4 45%,#3242b2);
  --glass:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.58) 45%,rgba(255,255,255,.74));
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(27,22,80,.04),0 24px 60px rgba(77,73,221,.11);
  --display:"Fraunces",Georgia,serif;
  --body:"Geist","Helvetica Neue","Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:24px; --radius-sm:16px;
  --ease:cubic-bezier(.22,.8,.26,.99);
}

/* ---------- Dark theme ---------- */
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0f0e1f; --paper-2:#1b1a33; --ink:#ecebff; --ink-dim:#b4b2d6; --ink-faint:#8d8bb4;
  --purple:#8d9bff; --purple-deep:#6f7fee; --purple-soft:#9aa6ff; --lilac:#3a3f7a; --periwinkle:#6f7fee; --mint:#1f4a43;
  --line:rgba(160,168,255,.16); --line-2:rgba(160,168,255,.30);
  --ok:#4fd08f; --ok-soft:rgba(79,208,143,.14); --warn:#f0b255; --warn-soft:rgba(240,178,85,.14); --bad:#ff7a70; --bad-soft:rgba(255,122,112,.14);
  --grad-btn:linear-gradient(135deg,#8d9bff -20%,#5668e8 45%,#4254d4);
  --glass:linear-gradient(135deg,rgba(40,38,78,.85),rgba(28,27,58,.7) 45%,rgba(36,34,72,.8));
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 6px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.35);
  --surface:#23224a; --surface-2:rgba(255,255,255,.06); --surface-3:rgba(255,255,255,.08); --tint:rgba(141,155,255,.16); --tint-2:rgba(141,155,255,.14); --card-edge:rgba(255,255,255,.08); --toast-fg:#0f0e1f;
  --tile-grad:linear-gradient(135deg,rgba(141,155,255,.22),rgba(141,155,255,.12)); --callout:rgba(141,155,255,.14);
  --blob1:rgba(80,92,210,.35); --blob2:rgba(120,90,220,.25); --blob3:rgba(40,150,130,.2); --blob4:rgba(150,90,200,.2);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0f0e1f; --paper-2:#1b1a33; --ink:#ecebff; --ink-dim:#b4b2d6; --ink-faint:#8d8bb4;
    --purple:#8d9bff; --purple-deep:#6f7fee; --purple-soft:#9aa6ff; --lilac:#3a3f7a; --periwinkle:#6f7fee; --mint:#1f4a43;
    --line:rgba(160,168,255,.16); --line-2:rgba(160,168,255,.30);
    --ok:#4fd08f; --ok-soft:rgba(79,208,143,.14); --warn:#f0b255; --warn-soft:rgba(240,178,85,.14); --bad:#ff7a70; --bad-soft:rgba(255,122,112,.14);
    --grad-btn:linear-gradient(135deg,#8d9bff -20%,#5668e8 45%,#4254d4);
    --glass:linear-gradient(135deg,rgba(40,38,78,.85),rgba(28,27,58,.7) 45%,rgba(36,34,72,.8));
    --glass-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 6px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.35);
    --surface:#23224a; --surface-2:rgba(255,255,255,.06); --surface-3:rgba(255,255,255,.08); --tint:rgba(141,155,255,.16); --tint-2:rgba(141,155,255,.14); --card-edge:rgba(255,255,255,.08); --toast-fg:#0f0e1f;
    --tile-grad:linear-gradient(135deg,rgba(141,155,255,.22),rgba(141,155,255,.12)); --callout:rgba(141,155,255,.14);
    --blob1:rgba(80,92,210,.35); --blob2:rgba(120,90,220,.25); --blob3:rgba(40,150,130,.2); --blob4:rgba(150,90,200,.2);
  }
}
.theme-btn{display:inline-grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);cursor:pointer;flex:none}
.theme-btn:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.theme-btn svg{width:18px;height:18px}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(42% 38% at 12% 8%,var(--blob1),transparent 70%),
  radial-gradient(36% 34% at 88% 14%,var(--blob2),transparent 70%),
  radial-gradient(40% 40% at 70% 92%,var(--blob3),transparent 70%),
  radial-gradient(30% 30% at 20% 80%,var(--blob4),transparent 70%),var(--paper)}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{margin:0;font-family:var(--display);color:var(--ink);text-wrap:balance}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-inline:24px}

/* ---------- Glass pill nav ---------- */
.navbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:20;margin-top:14px}
.pill-nav{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 26px;border-radius:999px;background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 8px rgba(27,22,80,.06),0 22px 50px rgba(77,73,221,.18);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.logo{display:inline-flex;align-items:baseline;font:600 27px/1 var(--display);letter-spacing:-.03em;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo .o{display:inline-block;width:.56em;height:.56em;border-radius:50%;background:var(--purple);position:relative;margin:0 .02em;transform:translateY(.02em)}
.logo .o::after{content:"";position:absolute;left:22%;right:22%;top:38%;height:30%;border:2px solid #fff;border-top:0;border-radius:0 0 999px 999px}
.logo small{font:500 12px/1 var(--body);color:var(--ink-faint);letter-spacing:0;margin-left:10px;padding-left:10px;border-left:1px solid var(--line-2)}
.links{display:flex;gap:2px;margin-inline:auto;min-width:0}
.links a{padding:9px 12px;border-radius:999px;color:var(--ink-dim);text-decoration:none;font:500 15px/1 var(--display);white-space:nowrap;position:relative}
.links a:hover{color:var(--ink)}
.links a.on{color:var(--ink);background:rgba(66,84,212,.08)}
.links .count{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;border-radius:999px;background:var(--bad);color:#fff;font:600 11px/1 var(--body);padding:0 5px;vertical-align:2px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 24px;font:600 15.5px/1 var(--display);cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.btn.primary{background:var(--grad-btn);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 26px rgba(77,73,221,.35)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px rgba(77,73,221,.42)}
.btn.glass{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),0 6px 18px rgba(77,73,221,.10)}
.btn.glass:hover{transform:translateY(-1px)}
.btn.danger{background:linear-gradient(135deg,#e0665b,#c0352b);color:#fff;box-shadow:0 10px 26px rgba(192,53,43,.28)}
.btn.sm{padding:8px 15px;font-size:13.5px}
.btn.link{background:none;padding:6px 4px;color:var(--purple);font:600 13.5px/1 var(--body)}
.btn.link::after{content:"→";transition:transform .25s var(--ease)}
.btn.link:hover::after{transform:translateX(3px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--purple);outline-offset:3px}

/* ---------- Hero & section heads ---------- */
.view{display:flex;flex-direction:column;gap:64px;padding-block:56px 72px}
.eyebrow{font:600 11.8px/1.2 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--purple)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding-top:18px}
.hero h1{font-weight:300;font-size:clamp(44px,6.4vw,84px);line-height:1.02;letter-spacing:-.03em}
.grad{font-style:italic;font-weight:400;background:var(--grad-accent);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.hero p{color:var(--ink-dim);font-size:17.5px;max-width:58ch;margin:0}
.hero .row{justify-content:center;margin-top:8px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.sec-head h2{font-weight:600;font-size:clamp(28px,3.4vw,44px);line-height:1.08;letter-spacing:-.02em;margin-top:12px}
.sec-head h2.big{font-weight:300;font-size:clamp(36px,4.6vw,60px)}
.smile{display:block;width:34px;height:10px;margin-top:10px;color:var(--purple)}
.sec-head p{color:var(--ink-dim);max-width:60ch;margin:10px 0 0}
.section{display:flex;flex-direction:column;gap:24px}

/* ---------- Glass cards ---------- */
.card{background:var(--glass);border-radius:var(--radius);box-shadow:var(--glass-shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);min-width:0;border:1px solid var(--card-edge)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 14px}
.card-h h3{font-size:20px;font-weight:600;letter-spacing:-.01em}
.card-b{padding:4px 24px 22px}
.icon-tile{width:38px;height:38px;border-radius:12px;background:var(--tile-grad);display:grid;place-items:center;color:var(--purple);flex:none;box-shadow:inset 0 0 0 1px rgba(66,84,212,.12)}
.icon-tile svg{width:18px;height:18px}
.grid{display:grid;gap:22px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}

/* Stats, like the website's hero cards */
.stats{width:100%;max-width:1000px;margin-top:22px}
.stat{padding:22px 18px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.stat .num{font:600 44px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .num sup{font-size:.42em;color:var(--purple);margin-left:2px}
.stat .lbl{font-size:13.5px;color:var(--ink-dim)}
.stat.alert .num{background:linear-gradient(110deg,#c0352b,#e0665b);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:600 12px/1.5 var(--body);white-space:nowrap;letter-spacing:0}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)}
.p-warn{color:var(--warn);background:var(--warn-soft)}
.p-bad{color:var(--bad);background:var(--bad-soft)}
.p-info{color:var(--purple);background:var(--tint)}
.p-mute{color:var(--ink-faint);background:var(--paper-2)}
.p-busy::before{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.tag-proto{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);background:rgba(253,241,220,.85);border-radius:999px;padding:7px 12px}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);padding:12px 24px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 24px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer;transition:background .2s}
tr.click:hover td{background:rgba(66,84,212,.04)}
.num-cell{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:0}
.muted{color:var(--ink-faint);font-size:12.5px}

/* Person + app chips */
.person{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--body);flex:none;color:#fff;box-shadow:0 4px 12px rgba(77,73,221,.2)}
.person b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person span:not(.avatar){display:block;font-size:12.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 10.5px/1 var(--body);color:#fff;flex:none;letter-spacing:-.02em}
.apps-row{display:flex;gap:5px;flex-wrap:wrap}
.apps-row .app-ic{width:24px;height:24px;font-size:9.5px;border-radius:7px}
.app-ic.off{opacity:.25;filter:grayscale(1)}
.app-ic.fail{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:500;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.chip .app-ic{width:22px;height:22px;font-size:8.5px;border-radius:50%}
.chip.plain{padding-left:12px}

/* Lists */
.li{display:flex;align-items:flex-start;gap:14px;padding:14px 24px;border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0}
.li.wrap{flex-wrap:wrap;align-items:center}
.li.wrap .grow{min-width:220px}
.li .meta{font-size:13px;color:var(--ink-faint)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none}
.empty{padding:30px 24px;color:var(--ink-faint);text-align:center;font-size:14px}
.tl{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;padding:10px 24px}
.tl .dot{margin-top:8px}
.tl .meta{font-size:12px;color:var(--ink-faint)}
.progress{height:6px;border-radius:999px;background:rgba(66,84,212,.08);overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad-accent);border-radius:999px;transition:width .5s var(--ease)}

/* Detail */
.profile{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:26px 28px}
.profile .avatar{width:64px;height:64px;font-size:20px}
.profile h2{font-weight:400;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;line-height:1.1}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 24px;padding:18px 28px 24px;border-top:1px solid var(--line);margin:0}
.facts dt{font:600 11px/1.2 var(--body);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.16em}
.facts dd{margin:6px 0 0;font-weight:500;overflow-wrap:anywhere}
.access-row{display:flex;align-items:center;gap:14px;padding:14px 24px;border-top:1px solid var(--line)}
.access-row .grow{flex:1;min-width:0}
.access-row .grow b{display:block;font-weight:600}
.access-row .grow span{display:block;font-size:12.5px;color:var(--ink-faint)}
.access-row .err{color:var(--bad)!important}
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 24px;border-top:1px solid var(--line);cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--purple);flex:none}
.check .grow{flex:1;min-width:0}
.check .tag{font:600 10.5px/1.4 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.check.done .lbl{color:var(--ink-faint);text-decoration:line-through}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font:500 14px/1 var(--display);cursor:pointer;background:none;border:0;padding:0;align-self:flex-start}
.back:hover{color:var(--purple)}

/* Forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label,.field .lab{font:600 13px/1.2 var(--body)}
.field .hint{font-size:12px;color:var(--ink-faint)}
.field .ferr{font-size:12px;font-weight:600;color:var(--bad)}
.input[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--bad)}
.input{border:0;box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface-3);border-radius:14px;padding:12px 14px;font-size:14.5px;width:100%;min-width:0}
.input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--purple)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;cursor:pointer;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s,background .2s}
.tile input{accent-color:var(--purple);width:17px;height:17px;flex:none}
.tile:has(input:checked){background:var(--tint-2);box-shadow:inset 0 0 0 1.5px var(--purple)}
.tile .t b{display:block;font-size:14px;font-weight:600}
.tile .t span{display:block;font-size:12px;color:var(--ink-faint)}
.subtabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:-8px;flex-wrap:wrap}
.subtabs button{border:0;background:transparent;color:var(--ink-dim);padding:9px 18px;border-radius:999px;font:600 14px/1 var(--body);cursor:pointer}
.subtabs button.on{background:var(--surface);color:var(--purple);box-shadow:0 2px 8px rgba(77,73,221,.15)}
.seg{display:inline-flex;background:var(--paper-2);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg label{padding:8px 16px;border-radius:999px;font:600 13px/1 var(--body);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--purple);box-shadow:0 2px 8px rgba(77,73,221,.15)}
.seg label:has(input:focus-visible){outline:2px solid var(--purple)}
.revoke-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.revoke-item .grow{flex:1;min-width:0}
.revoke-item b{display:block;font-size:14px}
.revoke-item span{display:block;font-size:12px;color:var(--ink-faint)}
.callout{display:flex;gap:12px;padding:14px 18px;border-radius:16px;background:var(--callout);font-size:14px;align-items:flex-start}
.callout.bad{background:var(--bad-soft)}
.callout svg{width:18px;height:18px;flex:none;color:var(--purple);margin-top:2px}
.callout.bad svg{color:var(--bad)}
.radio-li{display:flex;align-items:center;gap:14px;padding:13px 24px;border-top:1px solid var(--line);cursor:pointer}
.radio-li input{accent-color:var(--purple);width:17px;height:17px;flex:none}
.radio-li:has(input:checked){background:rgba(66,84,212,.05)}

/* Bundle cards (like "Six ways" service cards) */
.svc{padding:24px;display:flex;flex-direction:column;gap:14px}
.svc h3{font-size:21px;font-weight:600}

/* ---------- Onboarding wizard: 4 steps ----------
   Who does what: personal details come from the employee list (HR picks the person), the employee uploads their own
   documents on the Employee documents tab, and HR fills in the document data in step 2.
   Prototype: uploaded files stay in this browser and are not sent anywhere. Reading documents (OCR), creating the
   Google account and sending email need the backend, so they are simulated here and marked as such. */
const DOCS = [
  {k:"aadhaar", name:"Aadhaar card", req:false},
  {k:"pan", name:"PAN card", req:false},
  {k:"dl", name:"Driving licence", req:false},
  {k:"passport", name:"Passport", req:false},
  {k:"voter", name:"Voter ID", req:false},
  {k:"exp", name:"Previous experience letters", req:false, multi:true, max:10},
  {k:"edu", name:"Education certificates", req:false, multi:true, max:5},
  {k:"bank", name:"Bank passbook or cancelled cheque", req:false},
];
const MAX_MB = 5;
const OB_STEPS = ["Personal details","Documents and data","Work email","Review"];
const OB_DRAFT_KEY = "hr_ob_draft";
S.docs = S.docs||{};      // employee id -> { documentKey: [{name,size}] }, uploaded by the employee
S.docErr = S.docErr||{};
S.myId = S.myId||null;

const newOb = ()=>({step:1, fromReview:false, empId:null, d:{first:"",last:"",pemail:"",phone:"",address:"",dept:"Engineering",title:"",mgr:"",start:""},
  ids:{name:"",dob:"",aadhaar:"",pan:"",address:"",acct:"",ifsc:""}, src:{}, apps:null, reviewed:false, errors:{}, ocrDone:false, ocrMsg:""});
const obDocs = ob=>(ob.empId&&S.docs[ob.empId])||{};
const docCount = m=>Object.values(m||{}).reduce((n,a)=>n+(a?a.length:0),0);
function logAs(actor,action,emp,result){ S.audit.unshift({ts:new Date(TODAY.getTime()+(Date.now()-BOOT)),actor,action,emp:emp.name,empId:emp.id,app:null,result:result||"ok"}); }

const digits = s=>String(s||"").replace(/\D/g,"");
const V = {
  email: v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v||"").trim()),
  phone: v=>{let d=digits(v); if(d.length===12&&d.startsWith("91")) d=d.slice(2); return /^[6-9]\d{9}$/.test(d)},
  aadhaar: v=>/^[2-9]\d{11}$/.test(digits(v)),
  pan: v=>/^[A-Z]{5}\d{4}[A-Z]$/.test(String(v||"").trim().toUpperCase()),
  ifsc: v=>/^[A-Z]{4}0[A-Z0-9]{6}$/.test(String(v||"").trim().toUpperCase()),
  acct: v=>/^\d{9,18}$/.test(digits(v)),
  dob: v=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(v||"")) return false; const d=new Date(v+"T00:00:00"); if(isNaN(d)) return false; const age=(TODAY-d)/31557600000; return age>=16&&age<=80; },
};
const maskAadhaar = v=>digits(v).length===12?"•••• •••• "+digits(v).slice(-4):"";
const maskPan = v=>{const p=String(v||"").trim().toUpperCase();return p.length===10?p.slice(0,2)+"••••••"+p.slice(-2):""};
const maskAcct = v=>digits(v)?"•••• "+digits(v).slice(-4):"";
const maskMail = v=>{const [a,b]=String(v||"").split("@");return b?a.slice(0,2)+"•••@"+b:""};
const fmtSize = b=>b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const nameSplit = full=>{const p=String(full||"").trim().split(/\s+/);return {first:p[0]||"",last:p.slice(1).join(" ")}};

/* Work email: name.surname@wohlig.com, lowercase, no spaces or special characters, a number added if taken. */
function makeWorkEmail(first,last,isTaken){
  const clean=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
  const a=clean(first), b=clean(last);
  if(!a||!b) return "";
  const base=`${a}.${b}`; let n=1, email=`${base}@${DOMAIN}`;
  while(isTaken(email)){ n++; email=`${base}${n}@${DOMAIN}`; }
  return email;
}

/* A file must be PDF, JPG or PNG, not empty, and no larger than MAX_MB. */
function fileProblem(f){
  const extOk=/\.(pdf|jpe?g|png)$/i.test(f.name), typeOk=!f.type||["application/pdf","image/jpeg","image/png"].includes(f.type);
  if(!extOk||!typeOk) return `${f.name}: only PDF, JPG or PNG files are allowed.`;
  if(f.size===0) return `${f.name}: the file is empty.`;
  if(f.size>MAX_MB*1048576) return `${f.name}: the file is larger than ${MAX_MB} MB.`;
  return "";
}

/* Step 1 asks only for personal and job details. Documents come from the employee, so none are required here. */
function step1Errors(ob){
  const d=ob.d, e={};
  if(!d.first.trim()) e.first="Enter the first name.";
  if(!d.last.trim()) e.last="Enter the surname.";
  if(!V.email(d.pemail)) e.pemail="Enter a valid personal email.";
  else if(/@wohlig\.com$/i.test(d.pemail.trim())) e.pemail="Use a personal email, not a @wohlig.com address.";
  if(!V.phone(d.phone)) e.phone="Enter a 10-digit mobile number.";
  if(!d.address.trim()) e.address="Enter the address.";
  if(!d.title.trim()) e.title="Enter the job title.";
  if(!d.start) e.start="Pick the start date.";
  return e;
}
function step2Errors(ob){
  // Every field is optional, since HR may not have the documents yet. A value that is filled in must have the right format.
  const i=ob.ids, e={}, has=v=>String(v||"").trim()!=="";
  if(has(i.dob)&&!V.dob(i.dob)) e.dob="Enter a valid date of birth (age 16 to 80).";
  if(has(i.aadhaar)&&!V.aadhaar(i.aadhaar)) e.aadhaar="Aadhaar number must be 12 digits.";
  if(has(i.pan)&&!V.pan(i.pan)) e.pan="PAN must look like ABCDE1234F.";
  if(has(i.acct)&&!V.acct(i.acct)) e.acct="Bank account number must be 9 to 18 digits.";
  if(has(i.ifsc)&&!V.ifsc(i.ifsc)) e.ifsc="IFSC must look like HDFC0001234.";
  return e;
}

/* Simulated document reading: copies the name and address from step 1 into empty fields and marks them.
   Reading Aadhaar, PAN, date of birth and bank details from the files needs the real OCR service. */
function ocrRead(ob){
  if(!docCount(obDocs(ob))) return {ok:false,msg:"The employee has not uploaded any documents yet, so nothing was read."};
  const fill=(k,v)=>{ if(v&&!ob.ids[k]){ ob.ids[k]=v; ob.src[k]="ocr"; } };
  fill("name",(ob.d.first+" "+ob.d.last).trim());
  fill("address",ob.d.address.trim());
  return {ok:true,msg:"Prototype: name and address were filled in and marked. The other fields need the document-reading service, so type them in."};
}

/* Personal data comes from the employee list: HR picks a person who is waiting for onboarding. */
function obFetch(ob,id){
  const e=S.emps.find(x=>x.id===id); if(!e) return false;
  const {first,last}=nameSplit(e.name);
  ob.empId=e.id; ob.apps=null; ob.d.first=first; ob.d.last=last;
  if(e.start) ob.d.start=e.start;
  if(e.title&&e.title!=="—") ob.d.title=e.title;
  if(e.dept) ob.d.dept=e.dept;
  if(e.manager&&e.manager!=="—") ob.d.mgr=e.manager;
  if(e.personalEmail) ob.d.pemail=e.personalEmail;
  if(e.phone) ob.d.phone=e.phone;
  if(e.address) ob.d.address=e.address;
  return true;
}

/* Backend: the Express + Postgres server. When it is not reachable (for example the file is opened directly), the page
   keeps working with browser storage and in-memory data only. */
const api=async(method,url,body)=>{
  const r=await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>null);
  if(r.status===401){ location.href="/login"; }
  return {ok:r.ok,status:r.status,data};
};
const apiMsg=r=>(r.data&&r.data.error)||"Something went wrong. Try again.";

/* Who is signed in. An employee works on their own record, which is created here if the roster lacks it. */
async function boot(){
  try{
    const r=await api("GET","/api/me");
    if(r.status===401) return;
    if(r.ok){
      S.user=r.data; ACTOR=r.data.name;
      if(isEmployee()){
        let e=S.emps.find(x=>(x.email||"").toLowerCase()===r.data.email.toLowerCase());
        if(!e){ e=mk({name:r.data.name,email:r.data.email,status:"onboarding",dept:"—",title:"—",manager:"—",start:"",grants:{},onTasks:[]}); S.emps.push(e); }
        S.myId=e.id; S.route="docs";
      }
    }
  }catch(e){ /* no backend: prototype mode */ }
  applyUser(); render(); loadFromServer();
}
function applyUser(){
  const u=S.user; if(!u) return;
  $("#acct").style.display="";
  const cta=$(".cta"); if(cta) cta.style.display=isEmployee()?"none":"";
  $("#who").innerHTML=`Signed in as <b style="color:var(--ink)">${esc(u.name)}</b>, ${isEmployee()?"Employee":"HR"} · <a href="#" data-signout>Sign out</a>`;
}
S.serverDraft=null;
function applyServerRecord(rec){
  let e=S.emps.find(x=>(x.email||"").toLowerCase()===rec.email.toLowerCase());
  if(!e){ e=mk({name:rec.name,email:rec.email,status:"onboarding",grants:{},onTasks:ON_TASKS.map(t=>({t,done:false}))}); e.color=AV[S.emps.length%AV.length]; S.emps.push(e); }
  Object.assign(e,{name:rec.name,dept:rec.dept,title:rec.title||"—",manager:rec.manager||"—",start:rec.start,personalEmail:rec.personalEmail,phone:rec.phone,address:rec.address,ids:rec.ids});
  for(const a of rec.apps) if(!e.grants[a]||e.grants[a]==="revoked") e.grants[a]="none";
  e.laptop=e.laptop||{received:false,serial:"",date:""};
  return e;
}
async function loadFromServer(){
  try{
    const hr=!isEmployee();
    const [recs,draft,docs]=await Promise.all([hr?api("GET","/api/onboarding"):{ok:false},hr?api("GET","/api/onboarding/draft"):{ok:false},api("GET","/api/documents")]);
    if(recs.ok) recs.data.forEach(applyServerRecord);
    if(docs.ok){
      S.docs={};
      for(const d of docs.data){
        const e=S.emps.find(x=>(x.email||"").toLowerCase()===d.email);
        if(e) ((S.docs[e.id]=S.docs[e.id]||{})[d.key]=(S.docs[e.id][d.key]||[])).push({id:d.id,name:d.name,size:d.size});
      }
    }
    if(draft.ok) S.serverDraft=draft.data;
    render();
  }catch(e){ /* no backend: carry on locally */ }
}

function obRestoreDraft(ob){
  try{ const raw=S.serverDraft?JSON.stringify(S.serverDraft):localStorage.getItem(OB_DRAFT_KEY); if(!raw) return false; Object.assign(ob.d,JSON.parse(raw)); return true; }catch(e){ return false; }
}
async function obSaveDraft(ob){
  let saved=false;
  try{ localStorage.setItem(OB_DRAFT_KEY,JSON.stringify(ob.d)); saved=true; }catch(e){}
  try{ const r=await api("PUT","/api/onboarding/draft",ob.d); if(r.ok){ S.serverDraft={...ob.d}; saved=true; } }catch(e){}
  return saved;
}
function obClearDraft(){
  S.serverDraft=null;
  try{ localStorage.removeItem(OB_DRAFT_KEY); }catch(e){}
  api("DELETE","/api/onboarding/draft").catch(()=>{});
}

const obField=(lab,id,val,o={})=>{
  const {type="text",hint="",err="",ph="",rows=0,mono=false,full=false,badge=""}=o;
  const ctl=rows?`<textarea class="input" id="ob-${id}" rows="${rows}" placeholder="${esc(ph)}">${esc(val)}</textarea>`
    :`<input class="input${mono?" mono":""}" id="ob-${id}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off">`;
  return `<div class="field"${full?` style="grid-column:1/-1"`:""}><label for="ob-${id}">${lab}${badge}</label>${ctl}${hint?`<span class="hint">${hint}</span>`:""}${err?`<span class="ferr" role="alert">${esc(err)}</span>`:""}</div>`;
};

function obStepper(ob){
  return `<div class="stepper" role="list">${OB_STEPS.map((s,i)=>`<div class="stp ${ob.step===i+1?"on":ob.step>i+1?"done":""}" role="listitem"><b>${ob.step>i+1?"✓":i+1}</b>${esc(s)}</div>`).join("")}</div>`;
}

function obStep1(ob){
  const d=ob.d, er=ob.errors, mgrs=S.emps.filter(e=>e.status!=="offboarded");
  const waiting=S.emps.filter(e=>e.status==="onboarding").sort((a,b)=>a.name.localeCompare(b.name));
  const picked=ob.empId&&S.emps.find(x=>x.id===ob.empId);
  return `<div class="card"><div class="card-h"><h3>Fetch from the employee list</h3><span class="muted">Fills name, joining date, title and department</span></div><div class="card-b">
      ${picked?`<div class="callout" style="margin-bottom:14px">${svg("info")}<div>Filled from the employee list: <b>${esc(picked.name)}</b>, ${esc(picked.title)}, joining ${esc(fdate(picked.start))}. Phone, address and personal email still need to be added. <button type="button" class="btn link" data-ob-unfetch>Clear</button></div></div>`:""}
      ${waiting.length?`<div class="row"><select class="input" id="ob-pick" style="max-width:360px" aria-label="Person from the employee list"><option value="">Choose a person waiting for onboarding</option>${waiting.map(w=>`<option value="${w.id}" ${w.id===ob.empId?"selected":""}>${esc(w.name)}</option>`).join("")}</select><button type="button" class="btn glass" data-ob-fetch>Fill from list</button></div>`
        :`<p class="muted" style="margin:0">No one in the employee list is waiting for onboarding. Type the details below to add a new joiner.</p>`}
    </div></div>
    <div class="card"><div class="card-h"><h3>Candidate details</h3></div><div class="card-b form">
      ${obField("First name","first",d.first,{err:er.first,ph:"e.g. Priya"})}
      ${obField("Surname","last",d.last,{err:er.last,ph:"e.g. Shah"})}
      ${obField("Personal email","pemail",d.pemail,{type:"email",err:er.pemail,hint:"The work email and login details are sent here."})}
      ${obField("Phone","phone",d.phone,{type:"tel",err:er.phone,ph:"10-digit mobile number"})}
      ${obField("Address","address",d.address,{rows:3,full:true,err:er.address})}
    </div></div>
    <div class="card"><div class="card-h"><h3>Job details</h3><span class="muted">Filled in by HR</span></div><div class="card-b form">
      <div class="field"><label for="ob-dept">Department</label><select class="input" id="ob-dept">${Object.keys(DEPT_TPL).map(x=>`<option ${x===d.dept?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
      ${obField("Job title","title",d.title,{err:er.title,ph:"e.g. Software Development Engineer"})}
      <div class="field"><label for="ob-mgr">Reporting manager</label><select class="input" id="ob-mgr"><option value="">None</option>${mgrs.map(m=>`<option ${m.name===d.mgr?"selected":""}>${esc(m.name)}</option>`).join("")}</select></div>
      ${obField("Start date","start",d.start,{type:"date",err:er.start})}
    </div></div>`;
}

/* Documents are uploaded by the employee. HR sees their status here and cannot upload them. */
function obDocStatus(ob){
  const m=obDocs(ob), n=docCount(m);
  return `<div class="card"><div class="card-h"><h3>Documents</h3><span class="muted">Uploaded by the employee</span></div>
    ${ob.empId?"":`<div class="card-b" style="padding-bottom:0"><div class="callout">${svg("info")}<div>This person has no record yet. The employee can upload documents on the <b>Employee documents</b> tab once the record is created.</div></div></div>`}
    ${DOCS.map(def=>{const fl=m[def.k]||[];return `<div class="doc-row"><div class="grow"><b>${esc(def.name)} <span class="pill ${fl.length?"p-ok":"p-mute"}">${fl.length?"Received":"Not uploaded"}</span></b>${fl.length?`<div>${fl.map(f=>`<span class="fchip" style="padding-right:12px">${esc(f.name)} · ${fmtSize(f.size)}</span>`).join("")}</div>`:`<span class="sub">Waiting for the employee</span>`}</div></div>`}).join("")}
    <div class="card-b"><button type="button" class="btn link" data-go="docs">Open Employee documents</button><span class="muted"> ${n} file${n===1?"":"s"} received so far</span></div></div>`;
}

function obStep2(ob){
  const er=ob.errors, i=ob.ids, has=docCount(obDocs(ob))>0;
  const badge=k=>ob.src[k]==="ocr"?`<span class="srcbadge ocr" id="src-${k}">From document</span>`:`<span class="srcbadge typed" id="src-${k}">Typed</span>`;
  return `${obDocStatus(ob)}
    <div class="card"><div class="card-h"><h3>Document data</h3><span class="muted">Filled in by HR</span><button type="button" class="btn glass sm" data-ob-ocr ${has?"":"disabled"}>Read documents</button></div><div class="card-b">
      ${ob.ocrMsg?`<div class="callout" style="margin-bottom:16px">${svg("info")}<div>${esc(ob.ocrMsg)}</div></div>`:""}
      <div class="form">
      ${obField("Full name","id-name",i.name,{err:er.name,badge:badge("name")})}
      ${obField("Date of birth","id-dob",i.dob,{type:"date",err:er.dob,badge:badge("dob")})}
      ${obField("Aadhaar number","id-aadhaar",i.aadhaar,{err:er.aadhaar,mono:true,ph:"12 digits",badge:badge("aadhaar")})}
      ${obField("PAN","id-pan",i.pan,{err:er.pan,mono:true,ph:"ABCDE1234F",badge:badge("pan")})}
      ${obField("Address","id-address",i.address,{rows:3,full:true,err:er.address,badge:badge("address")})}
      ${obField("Bank account number","id-acct",i.acct,{err:er.acct,mono:true,badge:badge("acct")})}
      ${obField("IFSC code","id-ifsc",i.ifsc,{err:er.ifsc,mono:true,ph:"HDFC0001234",badge:badge("ifsc")})}
      </div><p class="muted" style="margin:14px 0 0">All of these are optional. Any value can be corrected. Fields filled from a document are marked, and the mark changes to "Typed" once you edit it.</p></div></div>`;
}

function obStep3(ob){
  const ex=ob.empId&&S.emps.find(x=>x.id===ob.empId);
  if(ex&&ex.email){
    ob.workEmail=ex.email;
    return `<div class="card"><div class="card-h"><h3>Work email</h3></div><div class="card-b" style="display:flex;flex-direction:column;gap:14px">
      <div class="input mono" style="background:var(--paper-2);font-size:18px">${esc(ob.workEmail)}</div>
      <div class="callout">${svg("info")}<div>This person already has a work email in the employee list, so none is generated.</div></div>
    </div></div>`;
  }
  ob.workEmail=makeWorkEmail(ob.d.first,ob.d.last,x=>!!emailTaken(x));
  const base=makeWorkEmail(ob.d.first,ob.d.last,()=>false);
  const bumped=ob.workEmail&&ob.workEmail!==base;
  return `<div class="card"><div class="card-h"><h3>Work email</h3></div><div class="card-b" style="display:flex;flex-direction:column;gap:14px">
      <div class="input mono" style="background:var(--paper-2);font-size:18px">${esc(ob.workEmail||"Add a first name and surname in step 1")}</div>
      <p style="margin:0;color:var(--ink-dim)">Built as <span class="mono">name.surname@${DOMAIN}</span>, in lowercase, with spaces and special characters removed. If the address is taken, a number is added.</p>
      ${bumped?`<div class="callout">${svg("info")}<div><b>${esc(base)}</b> already belongs to someone, so <b>${esc(ob.workEmail)}</b> is used.</div></div>`:""}
      <div class="callout">${svg("info")}<div>${esc(activationNote(ob.d.start))}</div></div>
      <div class="callout">${svg("info")}<div>On submit, the work email is sent to <b>${esc(maskMail(ob.d.pemail)||"the personal email")}</b>. <span class="muted">Simulated in this prototype: no email is sent.</span></div></div>
    </div></div>`;
}

function obStep4(ob){
  const d=ob.d, i=ob.ids, ex=ob.empId&&S.emps.find(x=>x.id===ob.empId);
  ob.workEmail=ex&&ex.email?ex.email:makeWorkEmail(d.first,d.last,x=>!!emailTaken(x));
  const sel=ob.apps||T(DEPT_TPL[d.dept]);
  const sec=(title,step,body)=>`<div class="card"><div class="card-h"><h3>${title}</h3><button type="button" class="btn link" data-ob-goto="${step}">Edit</button></div><div class="card-b">${body}</div></div>`;
  const kv=(pairs)=>`<dl class="rv">${pairs.map(([k,v])=>`<div><dt>${k}</dt><dd>${v||"—"}</dd></div>`).join("")}</dl>`;
  const m=obDocs(ob);
  const docs=DOCS.map(x=>`<div><dt>${esc(x.name)}</dt><dd>${(m[x.k]||[]).length?m[x.k].map(f=>esc(f.name)).join(", "):`<span class="muted">Not uploaded</span>`}</dd></div>`).join("");
  return `${sec("Personal details",1,kv([["Name",esc(d.first+" "+d.last)],["Personal email",esc(d.pemail)],["Phone",esc(d.phone)],["Address",esc(d.address)]]))}
    ${sec("Job details",1,kv([["Department",esc(d.dept)],["Job title",esc(d.title)],["Reporting manager",esc(d.mgr)],["Start date",esc(fdate(d.start))]]))}
    ${sec("Documents from the employee",2,`<dl class="rv">${docs}</dl>`)}
    ${sec("Document data",2,kv([["Name",esc(i.name)],["Date of birth",esc(i.dob?fdate(i.dob):"")],["Aadhaar",esc(maskAadhaar(i.aadhaar))],["PAN",esc(maskPan(i.pan))],["Address",esc(i.address)],["Bank account",esc(maskAcct(i.acct))],["IFSC",esc(String(i.ifsc).toUpperCase())]]))}
    ${sec("Work email",3,kv([["Work email",`<span class="mono">${esc(ob.workEmail)}</span>`],["Activation",esc(d.start&&d.start>todayIso()?`Created now, activates on ${fdate(d.start)}`:"Activated when created")]]))}
    <div class="card"><div class="card-h"><h3>Tools to give</h3><span class="pill p-info">Bundle: ${esc(TEMPLATES.find(x=>x.id===DEPT_TPL[d.dept]).name)}</span></div><div class="card-b" style="display:flex;flex-direction:column;gap:16px">
      <div class="tiles" id="ob-apps">${APPS.map(a=>`<label class="tile"><input type="checkbox" value="${a.id}" ${sel.includes(a.id)?"checked":""}>${appIc(a.id)}<span class="t"><b>${esc(a.name)}</b><span>${esc(a.sub)}</span></span></label>`).join("")}</div>
      <p class="muted" style="margin:0">Saved as this person's tool access, so offboarding can list it later.</p>
    </div></div>
    <label class="check" style="border:0;padding:0"><input type="checkbox" id="ob-reviewed" ${ob.reviewed?"checked":""}><div class="grow"><div class="lbl">I have reviewed all the details above</div></div></label>`;
}

const obTabs=cur=>`<div class="subtabs" role="tablist"><button type="button" role="tab" class="${cur==="onboard"?"on":""}" aria-selected="${cur==="onboard"}" data-go="onboard">New joiner</button><button type="button" role="tab" class="${cur==="docs"?"on":""}" aria-selected="${cur==="docs"}" data-go="docs">Employee documents</button></div>`;
function vOnboard(){
  if(!S.ob){ S.ob=newOb(); if(obRestoreDraft(S.ob)) S.obRestored=true; }
  const ob=S.ob;
  const body=[obStep1,obStep2,obStep3,obStep4][ob.step-1](ob);
  const last=ob.step===4;
  return `<section class="section">
  ${obTabs("onboard")}
  ${head("Onboarding","Add a new <span class=\"grad\">joiner.</span>","Personal details come from the employee list, the employee uploads their own documents, and HR fills in the document data. Nothing is created until you submit.","",true)}
  ${obStepper(ob)}
  ${S.obRestored?`<div class="callout">${svg("info")}<div>A saved draft was restored. It holds name, contact and job details only. ID numbers have to be added again. <button type="button" class="btn link" data-ob-cancel>Start over</button></div></div>`:""}
  <form id="obf" class="grid" style="gap:22px" novalidate>${body}
    <div class="row" style="justify-content:space-between">
      <div class="row">${ob.step>1?`<button type="button" class="btn glass" data-ob-back>Back</button>`:`<button type="button" class="btn glass" data-ob-cancel>Cancel</button>`}<button type="button" class="btn glass" data-ob-draft>Save draft</button></div>
      ${last?`<button type="submit" class="btn primary" id="ob-submit" ${ob.reviewed?"":"disabled"}>Submit and create account</button>`
            :`<button type="button" class="btn primary" data-ob-next>${ob.fromReview?"Back to review":"Continue"}</button>`}
    </div>
  </form></section>`;
}

function obCollect(ob){
  const g=id=>{const el=$("#ob-"+id);return el?el.value:undefined};
  if(ob.step===1) for(const k of ["first","last","pemail","phone","address","dept","title","mgr","start"]){const v=g(k); if(v!==undefined) ob.d[k]=v;}
  if(ob.step===2) for(const k of Object.keys(ob.ids)){const v=g("id-"+k); if(v!==undefined) ob.ids[k]=v;}
  if(ob.step===4){ const boxes=[...document.querySelectorAll("#ob-apps input")]; if(boxes.length) ob.apps=boxes.filter(b=>b.checked).map(b=>b.value); const r=$("#ob-reviewed"); if(r) ob.reviewed=r.checked; }
}
function obFocusError(){ const el=document.querySelector(".ferr,.derr"); if(el){ el.scrollIntoView({block:"center"}); const f=el.closest(".field,.doc-row"); const i=f&&f.querySelector("input:not([type=file]),textarea"); if(i) i.focus(); } }

function obNext(){
  const ob=S.ob; obCollect(ob);
  const errs=ob.step===1?step1Errors(ob):ob.step===2?step2Errors(ob):{};
  ob.errors=errs;
  if(Object.keys(errs).length){ render(); obFocusError(); toast("Please fix the highlighted fields."); return; }
  if(ob.step===1){ const r=ocrRead(ob); ob.ocrDone=r.ok; ob.ocrMsg=r.ok?r.msg:"The employee has not uploaded any documents yet. Fill in the document data by hand, or come back once they have."; }
  ob.step=ob.fromReview?4:ob.step+1; ob.fromReview=false;
  render(); window.scrollTo(0,0);
}

async function obSubmit(){
  const ob=S.ob; obCollect(ob);
  if(!ob.reviewed){ toast("Tick the review box before submitting."); return; }
  const apps=(ob.apps||[]).slice().sort((a,b)=>(a==="gws"?-1:b==="gws"?1:0));
  if(!apps.length){ toast("Pick at least one tool to give."); return; }
  let e=ob.empId?S.emps.find(x=>x.id===ob.empId):null;
  const existing=!!e;
  let email=existing&&e.email?e.email:makeWorkEmail(ob.d.first,ob.d.last,x=>!!emailTaken(x));
  let saved=null;
  try{
    const r=await api("POST","/api/onboarding",{d:ob.d,ids:ob.ids,apps,existingEmail:existing?e.email:undefined});
    if(r.status===400){ ob.errors=r.data.errors||{}; toast(Object.values(ob.errors)[0]||"The server rejected the details."); render(); return; }
    if(!r.ok){ toast("The server could not save this onboarding. Try again."); return; }
    saved=r.data; email=saved.email;
  }catch(err){ /* no backend: fall back to the local prototype behaviour below */ }
  if(!email){ toast("Add a first name and surname first."); return; }
  const full=(ob.d.first+" "+ob.d.last).trim();
  if(!existing){
    e=mk({name:full,dept:ob.d.dept,title:ob.d.title.trim()||"—",manager:ob.d.mgr||"—",start:ob.d.start,status:"onboarding",
      grants:all(apps,"none"),onTasks:ON_TASKS.map(t=>({t,done:false}))});
    e.color=AV[S.emps.length%AV.length]; e.email=email;
    S.emps.push(e);
    log(`Employee record created (${email})`,e,null,"ok");
  }else{
    // The person is already in the employee list, so the record is completed, not duplicated.
    Object.assign(e,{name:full,dept:ob.d.dept,title:ob.d.title.trim()||e.title,manager:ob.d.mgr||e.manager||"—",start:ob.d.start});
    for(const a of apps) if(!e.grants[a]||e.grants[a]==="revoked") e.grants[a]="none";
    log(`Onboarding details completed by HR (${docCount(S.docs[e.id])} document file${docCount(S.docs[e.id])===1?"":"s"} received)`,e,null,"ok");
  }
  // Only masked identity data is kept on the record. The numbers themselves are not stored in this prototype.
  e.personalEmail=ob.d.pemail.trim(); e.phone=ob.d.phone.trim(); e.address=ob.d.address.trim();
  e.ids={dob:ob.ids.dob,aadhaar:maskAadhaar(ob.ids.aadhaar),pan:maskPan(ob.ids.pan),acct:maskAcct(ob.ids.acct),ifsc:String(ob.ids.ifsc).trim().toUpperCase()};
  e.laptop=e.laptop||{received:false,serial:"",date:""};
  log(`Onboarding submitted after review. HR notified`,e,null,"info");
  log(`Work email sent to ${maskMail(e.personalEmail)} (simulated)`,e,null,"info");
  obClearDraft(); S.ob=null; S.obRestored=false;
  toast(`HR notified: ${e.name} was submitted for onboarding.${saved&&S.user?" A login was created with the default password.":""}`);
  go("employee",e.id);
  const toGive=apps.filter(a=>e.grants[a]!=="active");
  if(toGive.length) provision(e,toGive);
}

/* ---------- My documents: the employee uploads their own documents ---------- */
const docLinks=f=>f.id?`<a href="/api/documents/${f.id}/file" target="_blank" rel="noopener">${esc(f.name)}</a> · <a href="/api/documents/${f.id}/file?download=1" download="${esc(f.name)}">Save</a>`:esc(f.name);
/* HR reads what employees uploaded. Employees upload from their own login. */
function vDocsHr(){
  const withDocs=S.emps.filter(e=>docCount(S.docs[e.id])>0).sort((a,b)=>a.name.localeCompare(b.name));
  const waiting=S.emps.filter(e=>e.status==="onboarding"&&!docCount(S.docs[e.id])).sort((a,b)=>a.name.localeCompare(b.name));
  return `<section class="section">
  ${obTabs("docs")}
  ${head("Onboarding","Employee <span class=\"grad\">documents.</span>","Employees upload their own documents after signing in. You can open or save every file here.","",true)}
  ${withDocs.length?withDocs.map(e=>{const m=S.docs[e.id];return `<div class="card"><div class="card-h"><h3>${esc(e.name)}</h3><span class="muted">${esc(e.email)} · ${docCount(m)} file${docCount(m)===1?"":"s"}</span></div>
    ${DOCS.filter(d=>(m[d.k]||[]).length).map(d=>`<div class="doc-row"><div class="grow"><b>${esc(d.name)}</b>${m[d.k].map(f=>`<div class="sub">${docLinks(f)} · ${fmtSize(f.size)}</div>`).join("")}</div></div>`).join("")}</div>`}).join("")
    :`<div class="card"><div class="card-b muted">No employee has uploaded a document yet.</div></div>`}
  ${waiting.length?`<div class="card"><div class="card-h"><h3>Waiting for documents</h3><span class="muted">${waiting.length} in onboarding, nothing uploaded yet</span></div><div class="card-b muted">${waiting.map(e=>esc(e.name)).join(", ")}</div></div>`:""}
  </section>`;
}
function vDocs(){
  if(S.user&&!isEmployee()) return vDocsHr();
  const waiting=S.emps.filter(e=>e.status==="onboarding").sort((a,b)=>a.name.localeCompare(b.name));

document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.id==="md-pick"){ S.myId=Number(t.value)||null; S.docErr={}; render(); return; }
  if(t.matches&&t.matches("input[type=file][data-mydoc]")){
    const e=S.emps.find(x=>x.id===S.myId); if(!e) return;
    const k=t.dataset.mydoc, def=DOCS.find(x=>x.k===k), map=S.docs[e.id]||(S.docs[e.id]={}), cur=map[k]||(map[k]=[]), probs=[]; let added=0;
    for(const f of [...t.files]){
      const p=fileProblem(f); if(p){probs.push(p);continue}
      if(def.multi&&cur.length>=def.max){probs.push(`${def.name}: at most ${def.max} files.`);continue}
      // Upload to the server. If there is no backend, the file is only listed here and stays in the browser.
      let rec={name:f.name,size:f.size};
      try{
        const r=await fetch(`/api/documents/${k}?name=${encodeURIComponent(f.name)}`,{method:"PUT",headers:{"Content-Type":f.type||"application/octet-stream"},body:f});
        if(r.status===401){ location.href="/login"; return; }
        const data=await r.json().catch(()=>null);
        if(!r.ok){ probs.push(`${f.name}: ${(data&&data.error)||"the server could not save this file."}`); continue; }
        rec={id:data.id,name:data.name,size:data.size};
      }catch(err){ /* no backend */ }
      if(!def.multi) cur.length=0;
      cur.push(rec); added++;
    }
    S.docErr={}; if(probs.length) S.docErr[k]=probs.join(" ");
    if(added){ logAs(`${e.name} (employee)`,`Uploaded ${def.name}: ${added} file${added===1?"":"s"}`,e); toast(`${def.name} uploaded. HR can see it.`); }
    render(); return;
  }
  const ob=S.ob; if(!ob) return;
  if(t.id==="ob-dept"){ ob.apps=null; }
  if(t.id==="ob-reviewed"){ ob.reviewed=t.checked; const b=$("#ob-submit"); if(b) b.disabled=!t.checked; }

function lvPreview(r){ const e=empBy(r.email); const days=R.requestDays(r.from,r.to,r.half,holDays()); return e?R.allocate(r.type,days,lvBal(e,Number(r.from.slice(0,4)))):{paid:0,lop:days}; }

/* ---------- Offboarding: backend ----------
   With the server running, offboardings are saved in Postgres and the server removes access (Google Workspace first) and
   runs scheduled ones at 6 pm on the last working day. Without it, the page simulates the same flow in memory. */
S.off={online:false};
const transferEmail=name=>(S.emps.find(x=>x.name===name)||{}).email||"";
function applyOff(rec){
  const e=empBy(rec.email); if(!e) return;
  e.offId=rec.id; e.offRec=rec; e.lastDay=rec.lastDay;
  if(rec.status==="in_progress"||rec.status==="access_removed") e.status="offboarding";
  if(rec.status==="completed"){ e.status="offboarded"; e.end=rec.lastDay; }
  for(const s of rec.steps.filter(s=>s.kind==="tool")){
    if(s.status==="done"){ e.grants[s.key]="revoked"; delete e.errors[s.key]; }
    else if(s.status==="failed"){ e.grants[s.key]="failed"; e.errors[s.key]=s.detail; }
  }
  e.offTasks=rec.steps.filter(s=>s.kind==="task").map(s=>({t:s.label,done:s.status==="done",key:s.key}));
}
async function offLoad(){
  try{ const r=await api("GET","/api/offboarding"); if(!r.ok||!Array.isArray(r.data)) throw 0; S.off.online=true; r.data.forEach(applyOff); }catch(e){ /* no backend */ }
  render();
}
async function offCall(method,url,body){
  try{
    const r=await api(method,url,body);
    if(!r.ok) return {ok:false,error:(r.data&&(r.data.error||Object.values(r.data.errors||{})[0]))||"Could not save. Try again."};
    if(r.data&&r.data.steps) applyOff(r.data);
    lvLoad();   // leave after the last day may have been cancelled
    return {ok:true,data:r.data};
  }catch(e){ return {ok:false,error:"The server can't be reached. Check it is running, then try again."}; }
}
const isScheduled=e=>S.off.online?!!(e.offRec&&e.offRec.status==="scheduled"):!!e.offSched;
/* Leave that falls after the last working day will never be taken (the server cancels it; this mirrors that offline). */
const leaveAfter=(e,day)=>reqsOf(e.email).filter(r=>(r.status==="pending"||r.status==="approved")&&r.from>day);

/* Final settlement leave figures: unused casual leave is paid out, loss-of-pay days in the leaving month are deducted. */
function settlementFor(e,lastDay){
  if(!R||!R.validDate(lastDay||"")) return null;
  if(S.off.online&&e.offRec&&e.offRec.lastDay===lastDay&&e.offRec.settlement) return e.offRec.settlement;
  const p=payOf(e.email);
  return R.exitSettlement({emp:{start:e.start,casualOpening:p.casualOpening},lastDay,requests:reqsOf(e.email),compOffs:compsOf(e.email),monthlyGross:p.monthlyGross,holidays:holDays()});
}
function settlementHtml(e,lastDay,open){
  const s=settlementFor(e,lastDay); if(!s) return "";
  const after=open?leaveAfter(e,lastDay).length:0, mon=fdate(s.month+"-01").replace(/^1 /,"");
  const amt=v=>s.monthlyGross?inr(v):"—";
  return `<div class="field"><span class="lab">Final settlement: leave</span><div class="settle">
    <div><span>Unused casual leave paid out<small>${s.carried} carried + ${s.quota} for months worked − ${s.used} used</small></span><b>${dd(s.casualLeft)} · ${amt(s.encashment)}</b></div>
    <div><span>Loss of pay in ${esc(mon)}</span><b class="neg">${dd(s.lopDays)} · ${s.monthlyGross?"−"+inr(s.deduction):"—"}</b></div>
    <div class="tot"><span>Leave adjustment</span><b>${s.monthlyGross?inr(s.net):`<button type="button" class="btn link" data-lv="pay:${esc(e.email)}">Add monthly salary to see amounts</button>`}</b></div>
  </div>${after?`<span class="hint">${after} leave request${after===1?"":"s"} after the last working day will be cancelled.</span>`:""}</div>`;
}
/* Offboarding status on the employee page: scheduled (run now or call off), or the final settlement once it has started. */
function offCard(e){
  const sched=isScheduled(e);
  if(!sched&&e.status!=="offboarding"&&e.status!=="offboarded") return "";
  const rec=e.offRec, to=rec&&rec.transferTo?(empBy(rec.transferTo)||{name:rec.transferTo}).name:(e.offSched&&e.offSched.to)||"";
  return `<div class="card"><div class="card-h"><h3>Offboarding</h3>${sched?`<span class="pill p-warn">Scheduled</span>`:e.status==="offboarded"?`<span class="pill p-mute">Completed</span>`:`<span class="pill p-warn">In progress</span>`}</div>
    <div class="card-b" style="display:flex;flex-direction:column;gap:16px">
    ${sched?`<div class="callout">${svg("info")}<div>Access is removed automatically on <b>${esc(fdate(e.lastDay))} at 6:00 pm</b>${to?`. Drive files and email go to <b>${esc(to)}</b>`:""}.</div></div>
      <div class="row"><button class="btn danger sm" data-offrun="${e.id}">Remove access now</button><button class="btn glass sm" data-offcancel="${e.id}">Call off offboarding</button></div>`
      :to?`<div class="muted">Drive files and email moved to <b style="color:var(--ink)">${esc(to)}</b>.</div>`:""}
    ${settlementHtml(e,e.lastDay,false)}</div></div>`;
}

/* One write: the API when online (then reload), otherwise the same rules applied locally. Returns {ok, errors, error}. */
async function lvWrite(method,url,body,local){
  if(S.lv.online){
    try{ const r=await api(method,url,body); if(!r.ok) return {ok:false,errors:r.data&&r.data.errors,error:r.data&&r.data.error||"Could not save. Try again."}; await lvLoad(); return {ok:true,data:r.data}; }
    catch(e){ return {ok:false,error:"The server can't be reached. Check it is running, then try again."}; }
  }
  return local();
}
const lvApi = {
  request:(b)=>lvWrite("POST","/api/leave/requests",b,()=>{
    const e=empBy(b.email);

    const errors=R.requestProblems({emp:e,type:b.type,from:b.from,to,half,reason:b.reason,holidays:holDays(),existing:e?reqsOf(e.email):[],bal});

    S.lv.requests.push(r); return {ok:true,data:r};
  }),
  decide:(id,decision)=>lvWrite("POST",`/api/leave/requests/${id}/decision`,{decision},()=>{
    const r=S.lv.requests.find(x=>x.id===id);
    if(!r||r.status!=="pending") return {ok:false,error:"This request was already decided."};
    if(decision==="approved"){const a=lvPreview(r);r.days=a.paid+a.lop;r.paidDays=a.paid;r.lopDays=a.lop;}
    r.status=decision; return {ok:true,data:r};

  }),

    r.status="cancelled"; return {ok:true,data:r};
  }),

    const g=b.monthlyGross===""?null:Number(b.monthlyGross), o=Number(b.casualOpening||0), errors={};

function lvShowErrors(res,map){
  Object.values(map).forEach(id=>lvErr(id,""));
  for(const [k,msg] of Object.entries(res.errors||{})) lvErr(map[k]||map._,msg);
  if(res.error) toast(res.error);
  const first=Object.keys(res.errors||{})[0]; if(first&&map[first]) $("#"+map[first])?.focus();
}
/* Each type shows what the person has left, so the applier can see which one to pick. Comp off is only offered when they have earned one. */
function lvTypeOptions(e,year,sel){
  const b=e?lvBal(e,year):null;
  const note={casual:b?`${b.casual.left} days available`:"",sick:b?`${b.sick.left} days available`:"",
    compoff:b?(b.compoff.left>0?`${b.compoff.left} day${b.compoff.left===1?"":"s"} available`:"Not available"):"",unpaid:"salary cut"};
  return Object.entries(LTYPE).map(([k,v])=>{const off=k==="compoff"&&b&&b.compoff.left<=0;
    return `<option value="${k}" ${k===sel&&!off?"selected":""} ${off?"disabled":""}>${esc(v)}${note[k]?` · ${esc(note[k])}`:""}</option>`}).join("");
}

    ${lvField("lr-type","Type of leave",`<select class="input" id="lr-type">${lvTypeOptions(empBy(email),Number(t.slice(0,4)),"casual")}</select>`)}
    ${lvField("lr-reason","Note",`<textarea class="input" id="lr-reason" rows="3" placeholder="Type here"></textarea>`)}
    <div class="field"><label for="lr-notify">Notify <span class="muted">(optional)</span></label>
      <input class="input" id="lr-notify" list="lr-people" placeholder="Search employee" autocomplete="off">
      <datalist id="lr-people">${S.emps.filter(e=>e.status!=="offboarded"&&lc(e.email)!==lc(email)).map(e=>`<option value="${esc(e.name)}"></option>`).join("")}</datalist>

  const isHalf=()=>m.querySelector('input[name="lr-dur"]:checked').value==="half";
  const val=()=>{const half=isHalf()?$("#lr-half").value:null,from=$("#lr-from").value;
    return {email:$("#lr-email").value,type:$("#lr-type").value,from,to:half?from:$("#lr-to").value,half,reason:$("#lr-reason").value,notify:notify.slice()};};
  const chips=()=>{$("#lr-chips").innerHTML=notify.map((x,i)=>`<span class="fchip">${esc(empBy(x).name)}<button type="button" data-rm-notify="${i}" aria-label="Remove ${esc(empBy(x).name)}">×</button></span>`).join("");};
  const addNotify=()=>{const n=$("#lr-notify"),hit=S.emps.find(e=>lc(e.name)===lc(n.value.trim()));
    if(hit&&!notify.includes(hit.email)&&lc(hit.email)!==lc($("#lr-email").value)){notify.push(hit.email);n.value="";chips();}};
  m.addEventListener("click",ev=>{const b=ev.target.closest("[data-rm-notify]");if(b){notify.splice(Number(b.dataset.rmNotify),1);chips();}});
  m.addEventListener("keydown",ev=>{if(ev.target.id==="lr-notify"&&ev.key==="Enter"){ev.preventDefault();addNotify();}});
  const refresh=ev=>{
    const id=ev&&ev.target&&ev.target.id;
    if(id==="lr-notify"){addNotify();return}
    if(id&&id.startsWith("lr-")) lvErr(id,"");   // clear a field's error once it is edited
    $("#lr-to-wrap").hidden=isHalf(); $("#lr-half-wrap").hidden=!isHalf();
    $("#lr-from").closest(".field").querySelector("label").textContent=isHalf()?"Date":"From";

    const v=val(),e=empBy(v.email),box=$("#lr-preview"),pill=$("#lr-days");
    const okDates=R.validDate(v.from)&&R.validDate(v.to)&&v.to>=v.from, days=okDates?R.requestDays(v.from,v.to,v.half,holDays()):0;
    pill.textContent=dd(days);

    if(!days){box.innerHTML=`<div>${v.half?"That day is":"These dates are all"} a weekend or holiday, so no leave is needed.</div>`;return}
    const b=lvBal(e,Number(v.from.slice(0,4))), a=R.allocate(v.type,days,b);
    const left={casual:`${b.casual.left} casual days available`,sick:`${b.sick.left} sick days available`,compoff:`${b.compoff.left} comp off days available`,unpaid:"Unpaid, so all of it is a salary cut"}[v.type];
    box.innerHTML=`<div><b>${dd(days)}</b>${v.half?"":" (weekends and holidays not counted)"}. ${esc(left)}. If approved: <b>${dd(a.paid)} paid</b>${a.lop?`, <b style="color:var(--bad)">${dd(a.lop)} loss of pay</b>`:""}.</div>`;};
  m.addEventListener("input",refresh); m.addEventListener("change",refresh); refresh();
  m.querySelector("form").addEventListener("submit",async ev=>{ev.preventDefault();
    addNotify();
    const v=val();
    if(!v.reason.trim()) return lvShowErrors({errors:{reason:"Note is required."}},{reason:"lr-reason"});
    const res=await lvApi.request(v);
    if(!res.ok) return lvShowErrors(res,{email:"lr-email",type:"lr-type",from:"lr-from",to:v.half?"lr-from":"lr-to",half:"lr-half",reason:"lr-reason"});
    const e=empBy(v.email); log(`${LTYPE[v.type]} requested: ${lrange(v)}${v.notify.length?` (notify ${v.notify.map(x=>empBy(x).name).join(", ")})`:""}`,e,null,"info");
    m.remove(); toast(self?"Leave requested. HR will review it.":`Leave request for ${e.name} sent for approval.`); render();});
}

function lvPayModal(email){
  const e=empBy(email), p=payOf(email); if(!e) return;
  const m=modal(`<form id="lvf-pay" novalidate><div class="card-h" style="padding-top:24px"><h3>Pay &amp; balance: ${esc(e.name)}</h3></div><div class="card-b">
    ${lvField("lp-gross","Monthly gross salary (₹)",`<input class="input" type="number" min="1" step="1" inputmode="numeric" id="lp-gross" value="${p.monthlyGross??""}">`,"Used only to work out the salary cut for loss-of-pay days.")}
    ${lvField("lp-open",`Casual leave carried into ${R.POLICY.startYear}`,`<input class="input" type="number" min="0" max="365" step="0.5" id="lp-open" value="${p.casualOpening||0}">`,"Unused casual days from before this system started. They carry over like any other casual days.")}</div>
    <div class="modal-f"><button type="button" class="btn glass" data-close>Cancel</button><button type="submit" class="btn primary" data-ok>Save</button></div></form>`);
  m.querySelector("form").addEventListener("submit",async ev=>{ev.preventDefault();
    const v={monthlyGross:$("#lp-gross").value,casualOpening:$("#lp-open").value||0};
    const before=payOf(email), res=await lvApi.pay(e.email,v);
    if(!res.ok) return lvShowErrors(res,{monthlyGross:"lp-gross",casualOpening:"lp-open"});
    const after=payOf(email), changed=[];
    if((before.monthlyGross??null)!==(after.monthlyGross??null)) changed.push("monthly salary");
    if(Number(before.casualOpening||0)!==Number(after.casualOpening||0)) changed.push("opening casual balance");
    if(changed.length) log(`Updated ${changed.join(" and ")}`,e,null,"ok");
    m.remove(); toast(changed.length?`Saved for ${e.name}.`:"No changes to save."); render();});
}
async function lvAction(a){
  if(a==="new") return lvRequestModal(S.route==="employee"?(S.emps.find(x=>x.id===S.sel)||{}).email:"");
  if(a==="comp") return lvCompModal();
  if(a==="me-new") return lvRequestModal(myEmail(),true);
  if(a==="me-comp") return lvCompRequestModal(myEmail());
  if(a==="policy") return lvPolicyModal();
  const [kind,x,y]=a.split(":");
  if(kind==="pay") return lvPayModal(a.slice(4));
  if(kind==="decide"){
    const r=S.lv.requests.find(q=>q.id===Number(x)); if(!r) return;
    const res=await lvApi.decide(r.id,y); if(!res.ok){toast(res.error||"Could not save.");return}
    const done=S.lv.requests.find(q=>q.id===r.id)||r, e=empBy(done.email);
    log(`${LTYPE[done.type]} ${y}: ${lrange(done)}${y==="approved"?` (${dd(done.paidDays)} paid${done.lopDays?`, ${dd(done.lopDays)} loss of pay`:""})`:""}`,e,null,y==="approved"?"ok":"info");
    toast(`${LTYPE[done.type]} for ${e.name} ${y}${y==="approved"&&done.lopDays?`, ${dd(done.lopDays)} loss of pay`:""}.`); render(); return;
  }
  if(kind==="cancel"){
    const r=S.lv.requests.find(q=>q.id===Number(x)); if(!r) return;
    const res=await lvApi.cancel(r.id); if(!res.ok){toast(res.error||"Could not cancel.");return}
    log(`${LTYPE[r.type]} cancelled by the employee: ${lrange(r)}`,empBy(r.email),null,"info"); toast("Leave request cancelled."); render(); return;
  }
  if(kind==="comp-decide"){
    const c=S.lv.compOffs.find(q=>q.id===Number(x)); if(!c) return;
    const res=await lvApi.decideComp(c.id,y); if(!res.ok){toast(res.error||"Could not save.");return}
    const e=empBy(c.email); log(`Comp off credit ${y} for working on ${fdate(c.workedOn)}`,e,null,y==="approved"?"ok":"info");
    toast(`Comp off for ${e.name} ${y}.`); render(); return;
  }
  if(kind==="hol-del"){ const h=S.lv.holidays.find(q=>q.day===x); const res=await lvApi.delHoliday(x); if(!res.ok){toast(res.error||"Could not remove.");return}
    if(h) S.audit.unshift({ts:nowSim(),actor:ACTOR,action:`Holiday removed: ${h.name} on ${fdate(h.day)}`,emp:"All employees",app:null,result:"ok"}); render(); }
}
