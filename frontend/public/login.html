<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · HR Access Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Geist:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#fdfcff; --card:rgba(255,255,255,.85); --ink:#0e0a38; --ink-dim:#555177;
  --purple:#4254d4; --line:rgba(77,73,221,.22); --input:rgba(255,255,255,.9); --bad:#c0352b; --bad-soft:#fdeceb;
  --btn:linear-gradient(135deg,#7d8cee -20%,#4254d4 45%,#3242b2);
  --blob1:rgba(169,187,255,.45); --blob2:rgba(189,238,226,.38);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0f0e1f; --card:rgba(40,38,78,.8); --ink:#ecebff; --ink-dim:#b4b2d6;
    --purple:#8d9bff; --line:rgba(160,168,255,.30); --input:rgba(255,255,255,.07); --bad:#ff7a70; --bad-soft:rgba(255,122,112,.14);
    --btn:linear-gradient(135deg,#8d9bff -20%,#5668e8 45%,#4254d4);
    --blob1:rgba(111,127,238,.25); --blob2:rgba(31,74,67,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);font:15px/1.5 "Geist","Helvetica Neue",sans-serif;
  background-image:radial-gradient(60% 50% at 15% 10%,var(--blob1),transparent),radial-gradient(50% 45% at 90% 85%,var(--blob2),transparent)}
.card{width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:36px 32px;border:1px solid var(--line);backdrop-filter:blur(20px);box-shadow:0 24px 60px rgba(77,73,221,.12)}
.logo{display:inline-flex;align-items:center;font:700 34px/1 "Fraunces",Georgia,serif;letter-spacing:-.02em}
.lg{height:1.25em;width:auto;display:block}
.lg-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg-light{display:none}:root:not([data-theme="light"]) .lg-dark{display:block}}
:root[data-theme="dark"] .lg-light{display:none}
:root[data-theme="dark"] .lg-dark{display:block}
.app-name{margin-top:8px;font:500 13px/1 "Geist",sans-serif;color:var(--ink-dim);letter-spacing:.04em;text-transform:uppercase}
h1{font:400 26px/1.2 "Fraunces",Georgia,serif;margin:28px 0 6px}
p.sub{margin:0 0 22px;color:var(--ink-dim)}
label{display:block;font-weight:500;margin:0 0 6px}
.field{margin-bottom:16px}
input{width:100%;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--input);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit}
input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--purple)}
button{width:100%;border:0;border-radius:999px;padding:14px;background:var(--btn);color:#fff;font:600 16px/1 "Fraunces",Georgia,serif;cursor:pointer;margin-top:4px}
button:disabled{opacity:.6;cursor:wait}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.err[hidden]{display:none}
.hint{margin:20px 0 0;font-size:13px;color:var(--ink-dim)}
.or{display:flex;align-items:center;gap:12px;margin:20px 0 16px;color:var(--ink-dim);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px 14px;border-radius:999px;background:var(--input);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font:600 15px/1 "Geist",sans-serif;text-decoration:none;cursor:pointer}
.gbtn:hover{box-shadow:inset 0 0 0 1.5px var(--purple)}
.gbtn[aria-disabled="true"]{opacity:.6;cursor:not-allowed}
.gbtn[aria-disabled="true"]:hover{box-shadow:inset 0 0 0 1px var(--line)}
.gbtn svg{width:20px;height:20px;flex:none}
.gnote{margin:10px 0 0;font-size:12.5px;color:var(--ink-dim);text-align:center}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><img class="lg lg-light" src="/wohlig-logo.png" alt="wohlig"><img class="lg lg-dark" src="/wohlig-logo-dark.png" alt=""></div>
  <div class="app-name">HR Access Hub</div>
  <h1>Sign in</h1>
  <p class="sub">Use your work email and the password HR gave you.</p>
  <form id="f" novalidate>
    <div class="err" id="err" role="alert" hidden></div>
    <div class="field"><label for="email">Work email</label><input id="email" type="email" autocomplete="username" placeholder="name.surname@wohlig.com" required autofocus></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button type="submit" id="go">Sign in</button>
  </form>
  <div class="or" aria-hidden="true">or</div>
  <a class="gbtn" id="google" href="/auth/google">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    Continue with Google
  </a>
  <p class="gnote" id="gnote" hidden></p>
  <p class="hint">No account or forgot your password? Ask HR.</p>
</main>
<script>
const MESSAGES={
  invite:"That invite link has expired or was already used. Ask HR to send a new one.",
  google_off:"Google sign-in is not set up yet. Use your password for now.",
  google_cancelled:"Google sign-in was cancelled.",
  google_domain:"Use your @wohlig.com Google account.",
  google_no_account:"That Google account has no HR Access Hub account yet. Ask HR to create one.",
  google_state:"That sign-in took too long or came from another page. Try again.",
  google:"Google sign-in did not work. Try again."
};
(function(){
  const code=new URLSearchParams(location.search).get("error");
  if(code){ const e=document.getElementById("err"); e.textContent=MESSAGES[code]||"Could not sign in."; e.hidden=false; history.replaceState(null,"","/login"); }
  const g=document.getElementById("google");
  fetch("/api/login-options").then(r=>r.json()).then(o=>{
    if(o&&o.google) return;
    g.setAttribute("aria-disabled","true");
    g.addEventListener("click",ev=>{ ev.preventDefault(); const n=document.getElementById("gnote"); n.textContent="Google sign-in is not set up yet. Ask your admin to add the Google credentials."; n.hidden=false; });
  }).catch(()=>{});
})();
const f=document.getElementById("f"), err=document.getElementById("err"), go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault();
  err.hidden=true;
  if(!/^[^@\s]+@wohlig\.com$/i.test(document.getElementById("email").value.trim())){ err.textContent="Use your @wohlig.com work email."; err.hidden=false; return; }
  go.disabled=true;
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("pw").value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){ location.href="/"; return; }
    err.textContent=d.error||"Could not sign in."; err.hidden=false;
  }catch(x){ err.textContent="Could not reach the server."; err.hidden=false; }
  go.disabled=false;
});
</script>
</body>
</html>
