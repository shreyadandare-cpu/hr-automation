<title>HR Access Hub Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Wohlig look: floating glass nav, serif headings, lavender paper, glass cards. Light only, like wohlig.com.
   Data comes from the HR backend through the mcp capability. Nothing secret is on this page. */
:root{
  color-scheme:light;
  --paper:#fdfcff; --paper-2:#f4f4fd; --ink:#0e0a38; --ink-dim:#555177; --ink-faint:#7c7aa0;
  --purple:#4254d4; --purple-deep:#3242b2; --purple-soft:#7d8cee; --periwinkle:#a9bbff;
  --line:rgba(77,73,221,.12); --line-2:rgba(77,73,221,.22);
  --ok:#14794a; --ok-soft:#e1f5ec; --warn:#9a5a07; --warn-soft:#fdf1dc; --bad:#c0352b; --bad-soft:#fdeceb;
  --grad-accent:linear-gradient(110deg,var(--purple) 10%,var(--purple-soft) 55%,var(--periwinkle));
  --grad-btn:linear-gradient(135deg,#7d8cee -20%,#4254d4 45%,#3242b2);
  --glass:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.58) 45%,rgba(255,255,255,.74));
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(27,22,80,.04),0 24px 60px rgba(77,73,221,.11);
  --display:"Fraunces",Georgia,serif; --body:"Geist","Helvetica Neue","Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:24px; --ease:cubic-bezier(.22,.8,.26,.99);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(42% 38% at 12% 8%,rgba(169,187,255,.45),transparent 70%),
  radial-gradient(36% 34% at 88% 14%,rgba(198,205,255,.55),transparent 70%),
  radial-gradient(40% 40% at 70% 92%,rgba(189,238,226,.38),transparent 70%),var(--paper)}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{margin:0;font-family:var(--display);color:var(--ink);text-wrap:balance}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-inline:24px}

.navbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:20;margin-top:14px}
.pill-nav{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 26px;border-radius:999px;background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 8px rgba(27,22,80,.06),0 22px 50px rgba(77,73,221,.18);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.logo{display:inline-flex;align-items:baseline;font:600 27px/1 var(--display);letter-spacing:-.03em;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo .o{display:inline-block;width:.56em;height:.56em;border-radius:50%;background:var(--purple);position:relative;margin:0 .02em;transform:translateY(.02em)}
.logo .o::after{content:"";position:absolute;left:22%;right:22%;top:38%;height:30%;border:2px solid #fff;border-top:0;border-radius:0 0 999px 999px}
.logo small{font:500 12px/1 var(--body);color:var(--ink-faint);letter-spacing:0;margin-left:10px;padding-left:10px;border-left:1px solid var(--line-2)}
.links{display:flex;gap:2px;margin-inline:auto;min-width:0}
.links a{padding:9px 14px;border-radius:999px;color:var(--ink-dim);text-decoration:none;font:500 15px/1 var(--display);white-space:nowrap}
.links a:hover{color:var(--ink)}
.links a.on{color:var(--ink);background:rgba(66,84,212,.08)}
.links .count{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;border-radius:999px;background:var(--bad);color:#fff;font:600 11px/1 var(--body);padding:0 5px;vertical-align:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 24px;font:600 15.5px/1 var(--display);cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.btn.primary{background:var(--grad-btn);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 26px rgba(77,73,221,.35)}
.btn.primary:hover{transform:translateY(-1px)}
.btn.glass{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),0 6px 18px rgba(77,73,221,.10)}
.btn.danger{background:linear-gradient(135deg,#e0665b,#c0352b);color:#fff;box-shadow:0 10px 26px rgba(192,53,43,.28)}
.btn.sm{padding:8px 15px;font-size:13.5px}
.btn.link{background:none;padding:6px 4px;color:var(--purple);font:600 13.5px/1 var(--body)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--purple);outline-offset:3px}

.view{display:flex;flex-direction:column;gap:56px;padding-block:48px 64px}
.eyebrow{font:600 11.8px/1.2 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--purple)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.hero h1{font-weight:300;font-size:clamp(40px,5.6vw,72px);line-height:1.02;letter-spacing:-.03em}
.grad{font-style:italic;font-weight:400;background:var(--grad-accent);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.hero p{color:var(--ink-dim);font-size:17px;max-width:58ch;margin:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.sec-head h2{font-weight:600;font-size:clamp(28px,3.2vw,40px);line-height:1.1;letter-spacing:-.02em;margin-top:10px}
.sec-head p{color:var(--ink-dim);max-width:60ch;margin:8px 0 0}
.smile{display:block;width:34px;height:10px;margin-top:10px;color:var(--purple)}
.section{display:flex;flex-direction:column;gap:22px}

.card{background:var(--glass);border-radius:var(--radius);box-shadow:var(--glass-shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);min-width:0;border:1px solid rgba(255,255,255,.9)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 14px}
.card-h h3{font-size:19px;font-weight:600}
.card-b{padding:4px 24px 22px}
.grid{display:grid;gap:22px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.stats{width:100%;margin-top:6px}
.stat{padding:22px 18px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.stat .num{font:600 42px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:13.5px;color:var(--ink-dim)}
.stat.alert .num{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:600 12px/1.5 var(--body);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)}
.p-warn{color:var(--warn);background:var(--warn-soft)}
.p-bad{color:var(--bad);background:var(--bad-soft)}
.p-info{color:var(--purple);background:#eceeff}
.p-mute{color:var(--ink-faint);background:var(--paper-2)}
.p-busy::before{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.tag-proto{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);background:rgba(253,241,220,.85);border-radius:999px;padding:7px 12px}
.banner{border-radius:16px;padding:14px 18px;background:var(--warn-soft);color:#6b4a0f;font-size:14.5px;max-width:880px;margin:0 auto}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);padding:12px 24px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 24px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(66,84,212,.04)}
.num-cell{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:0}
.muted{color:var(--ink-faint);font-size:12.5px}

.person{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--body);flex:none;color:#fff}
.person b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person span{display:block;font-size:12.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 10.5px/1 var(--body);color:#fff;flex:none}
.apps-row{display:flex;gap:5px;flex-wrap:wrap}
.apps-row .app-ic{width:24px;height:24px;font-size:9.5px;border-radius:7px}
.app-ic.off{opacity:.25;filter:grayscale(1)}
.app-ic.fail{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:500;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.chip .app-ic{width:22px;height:22px;font-size:8.5px;border-radius:50%}
.chip.plain{padding-left:12px}

.li{display:flex;align-items:flex-start;gap:14px;padding:14px 24px;border-top:1px solid var(--line)}
.li .grow{flex:1;min-width:0}
.li .meta{font-size:13px;color:var(--ink-faint)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none}
.empty{padding:30px 24px;color:var(--ink-faint);text-align:center;font-size:14px}
.tl{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;padding:10px 24px}
.tl .dot{margin-top:8px}
.tl .meta{font-size:12px;color:var(--ink-faint)}
.progress{height:6px;border-radius:999px;background:rgba(66,84,212,.08);overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad-accent);border-radius:999px;transition:width .5s var(--ease)}

.profile{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:26px 28px}
.profile .avatar{width:64px;height:64px;font-size:20px}
.profile h2{font-weight:400;font-size:clamp(28px,3.2vw,38px);letter-spacing:-.02em;line-height:1.1}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 24px;padding:18px 28px 24px;border-top:1px solid var(--line);margin:0}
.facts dt{font:600 11px/1.2 var(--body);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.16em}
.facts dd{margin:6px 0 0;font-weight:500;overflow-wrap:anywhere}
.access-row{display:flex;align-items:center;gap:14px;padding:14px 24px;border-top:1px solid var(--line)}
.access-row .grow{flex:1;min-width:0}
.access-row .grow b{display:block;font-weight:600}
.access-row .grow span{display:block;font-size:12.5px;color:var(--ink-faint)}
.access-row .err{color:var(--bad)!important}
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 24px;border-top:1px solid var(--line)}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--purple);flex:none}
.check .grow{flex:1;min-width:0}
.check .tag{font:600 10.5px/1.4 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.check.done .lbl{color:var(--ink-faint);text-decoration:line-through}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);font:500 14px/1 var(--display);cursor:pointer;background:none;border:0;padding:0;align-self:flex-start}
.back:hover{color:var(--purple)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label,.field .lab{font:600 13px/1.2 var(--body)}
.field .hint{font-size:12px;color:var(--ink-faint)}
.input{border:0;box-shadow:inset 0 0 0 1px var(--line-2);background:rgba(255,255,255,.85);border-radius:14px;padding:12px 14px;font-size:14.5px;width:100%;min-width:0}
.input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--purple)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;cursor:pointer;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line)}
.tile input{accent-color:var(--purple);width:17px;height:17px;flex:none}
.tile:has(input:checked){background:#f1f2ff;box-shadow:inset 0 0 0 1.5px var(--purple)}
.tile .t b{display:block;font-size:14px;font-weight:600}
.tile .t span{display:block;font-size:12px;color:var(--ink-faint)}
.revoke-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line)}
.revoke-item .grow{flex:1;min-width:0}
.revoke-item b{display:block;font-size:14px}
.revoke-item span{display:block;font-size:12px;color:var(--ink-faint)}
.callout{display:flex;gap:12px;padding:14px 18px;border-radius:16px;background:rgba(236,238,255,.85);font-size:14px;align-items:flex-start}
.callout.bad{background:var(--bad-soft)}
.callout svg{width:18px;height:18px;flex:none;color:var(--purple);margin-top:2px}
.callout.bad svg{color:var(--bad)}
.radio-li{display:flex;align-items:center;gap:14px;padding:13px 24px;border-top:1px solid var(--line);cursor:pointer}
.radio-li input{accent-color:var(--purple);width:17px;height:17px;flex:none}
.radio-li:has(input:checked){background:rgba(66,84,212,.05)}
.svc{padding:24px;display:flex;flex-direction:column;gap:14px}
.svc h3{font-size:21px;font-weight:600}
.svc p{margin:0;color:var(--ink-dim);font-size:14px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.filters .input{width:auto;padding:10px 14px;font-size:14px}
.filters .grow{flex:1;min-width:180px}
.datefield{display:flex;gap:8px;align-items:stretch}
body.viewonly [data-provision],body.viewonly [data-offboard],body.viewonly [data-confirmoff],body.viewonly [data-schedule],body.viewonly [data-retry],body.viewonly [data-go="onboard"],body.viewonly [data-go="offboard"],body.viewonly .cal{display:none!important}
body.viewonly label.check,body.viewonly label.radio-li{pointer-events:none;opacity:.85}
.cal-pop{position:absolute;z-index:70;background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(14,10,56,.22),inset 0 0 0 1px var(--line);padding:14px;width:286px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font:600 16px/1 var(--display)}
.cal-pick{display:flex;gap:6px;align-items:center}
.cal-sel{border:0;background:var(--paper-2);border-radius:10px;padding:6px 8px;font:600 14px/1 var(--body);color:var(--ink);cursor:pointer}
.cal-nav{border:0;background:var(--paper-2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-dow{font:600 11px/1 var(--body);color:var(--ink-faint);padding:6px 0;letter-spacing:.06em}
.cal-day{border:0;background:none;border-radius:50%;width:36px;height:36px;margin:auto;cursor:pointer;font:500 14px/1 var(--body);color:var(--ink)}
.cal-day:hover{background:var(--accent-soft,#eef0ff)}
.cal-day.muted{color:#c3c3d6}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--purple)}
.cal-day.sel{background:var(--purple);color:#fff}
.datefield .input{flex:1;min-width:0;cursor:pointer}
.datefield .cal{padding:0 14px;font-size:18px;line-height:1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:28px 40px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:13px}

.scrim{position:fixed;inset:0;background:rgba(14,10,56,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:var(--radius);box-shadow:0 30px 80px rgba(14,10,56,.3);width:min(540px,100%);max-height:90vh;overflow:auto}
.modal .card-b{display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px 22px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;box-shadow:0 18px 40px rgba(14,10,56,.3);max-width:calc(100% - 32px);text-align:center}

@media (max-width:1080px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.g2{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pill-nav{flex-wrap:wrap;border-radius:28px;padding:12px 12px 10px 22px}
  .links{order:3;width:100%;overflow-x:auto;margin:4px -12px 0 -22px;padding:0 12px 0 16px}
}
@media (max-width:720px){
  .wrap{padding-inline:16px}
  .view{gap:40px;padding-block:32px 52px}
  .form{grid-template-columns:minmax(0,1fr)}
  .logo small{display:none}
  .hide-sm{display:none}
  th,td{padding-inline:16px}.card-h,.card-b,.li,.access-row,.check,.radio-li,.filters{padding-inline:16px}
  .profile,.facts{padding-inline:18px}
}
@media (max-width:460px){.stat .num{font-size:34px}.facts{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
/* ---------- constants (labels only; the server decides the rules) ---------- */
const APPS = [
  {id:"gws",   name:"Google Workspace", sub:"Gmail · Drive · Calendar", mono:"GW", color:"#1a73e8"},
  {id:"gemini",name:"Gemini",           sub:"Gemini for Workspace licence", mono:"Ge", color:"#6f5bd8"},
  {id:"claude",name:"Claude",           sub:"Claude Team seat", mono:"Cl", color:"#c96442"},
  {id:"github",name:"GitHub",           sub:"wohlig org and team", mono:"GH", color:"#24292f"},
  {id:"gcp",   name:"Google Cloud",     sub:"IAM roles on wohlig projects", mono:"GC", color:"#188038"},
];
const APP = Object.fromEntries(APPS.map(a=>[a.id,a]));
const DEPTS = ["Engineering","Data","DevOps & Cloud","Gen AI","Sales","HR","Finance & Admin","Leadership"];
const AV = ["#4254d4","#7d6ee8","#0e7c86","#b4472a","#2f6f3e","#9a3b72","#555177","#3242b2"];
const TOOL = {
  roster:"get_roster", confirm:"confirm_onboarding", tick:"tick_checklist", offboard:"offboard_employee",
  create:"create_employee", audit:"list_audit", schedule:"schedule_leaving"
};
const SERVER = "host:hr-automation";
const NAV = [["dashboard","Dashboard"],["employees","Employees"],["onboard","Onboarding"],["offboard","Offboarding"],["audit","Audit log"]];

/* ---------- state ---------- */
const S = { route:"dashboard", sel:null, q:"", offSel:null, emps:[], audit:[], loaded:false, offline:false, busy:false, loggedIn:false };

/* ---------- backend ---------- */
let MCP = null;
async function connect(){
  try { MCP = window.claude ? await window.claude.use("mcp") : null; } catch(e){ MCP = null; }
  S.offline = !MCP;
}
const SESSION_KEY = "hr_session";
const getSession = () => { try { return sessionStorage.getItem(SESSION_KEY) || ""; } catch(e){ return ""; } };
const setSession = (t) => { try { t ? sessionStorage.setItem(SESSION_KEY, t) : sessionStorage.removeItem(SESSION_KEY); } catch(e){} };
async function call(tool, args){
  if(!MCP) throw new Error("The HR backend is not connected.");
  const r = await MCP.callTool(SERVER, tool, { ...(args ?? {}), session: getSession() });
  // Use the parsed payload when there is one; otherwise parse the first text block ourselves.
  let p = r && r.payload;
  if(p === undefined || typeof p === "string"){
    const txt = (r && r.content || []).find(c=>c.type==="text");
    const raw = txt ? txt.text : p;
    try { p = JSON.parse(raw); } catch(e){ p = raw; }
  }
  return p;
}
function userMessage(err){
  const code = err && err.code;
  if(code === "server_not_connected") return "The HR backend is not connected in Claude. Add the hr-automation server, then reload.";
  if(code === "needs_reauth") return "Reconnect the HR backend in Claude Settings, then try again.";
  if(code === "not_in_manifest" || code === "blocked_by_policy") return "This page is not allowed to use the HR backend for your account.";
  if(code === "tool_error") return err.message;
  if(code === "cancelled") return "The request was cancelled. If Claude asked for permission, choose Allow, then reload. Nothing changed.";
  return (err && err.message ? err.message : "Something went wrong. Nothing changed.") + (code ? " ("+code+")" : "");
}
async function run(label, fn){
  if(S.busy) return;
  S.busy = true; render();
  let out;
  try { out = await fn(); toast(label); }
  catch(err){ toast(userMessage(err)); }
  finally { S.busy = false; }
  await refresh();
  return out;
}

/* map server rows to the shape the views use */
function toEmp(r){
  const grants = r.grants || {};
  return {
    id:r.id, no:r.emp_no || "Not assigned", name:r.full_name, email:r.work_email, title:r.job_title || "—",
    dept:r.department, start:r.start_date, lastDay:r.last_working_day || null, status:r.status,
    manager:"—", color:AV[r.id % AV.length],
    grants:Object.fromEntries(Object.entries(grants).map(([k,v])=>[k,v.status])),
    errors:Object.fromEntries(Object.entries(grants).filter(([,v])=>v.error).map(([k,v])=>[k,v.error])),
    onTasks:(r.checklist||[]).filter(c=>c.phase==="onboarding").map(c=>({id:c.id,t:c.title,done:c.done})),
    offTasks:(r.checklist||[]).filter(c=>c.phase==="offboarding").map(c=>({id:c.id,t:c.title,done:c.done})),
  };
}
async function refresh(){
  await connect();
  if(!MCP){ S.emps = []; S.audit = []; S.loaded = true; render(); return; }
  S.error = null;
  if(!getSession()){ S.me = null; S.loggedIn = false; S.loaded = true; render(); return; }
  try{
    const me = await call("whoami");
    S.me = me; S.loggedIn = !!(me && me.role);
  } catch(err){
    // An expired or unknown session sends the person back to sign-in with the reason shown.
    setSession("");
    S.me = null; S.loggedIn = false; S.loaded = true;
    S.signinError = userMessage(err);
    render(); return;
  }
  try{
    const roster = await call(TOOL.roster);
    if(!Array.isArray(roster)) throw new Error("The backend answered, but not with a list of employees: " + String(typeof roster === "string" ? roster : JSON.stringify(roster)).slice(0,160));
    S.emps = roster.map(toEmp);
  } catch(err){ S.error = "Could not load employees: " + userMessage(err); }
  try{
    const audit = await call(TOOL.audit,{limit:200});
    S.audit = (Array.isArray(audit) ? audit : []).map(a=>({ts:new Date(a.ts), actor:a.actor, action:a.action, emp:a.employee||"—", app:a.app_code||null, result:a.result}));
  } catch(err){ if(!S.error) S.error = "Could not load the audit log: " + userMessage(err); }
  S.loaded = true;
  render();
}

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = n=>String(n).split(/\s+/).map(p=>p[0]).slice(0,2).join("").toUpperCase();
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fdate = s=>{if(!s)return"—";const [y,m,d]=String(s).split("-").map(Number);return `${d} ${MON[m-1]} ${y}`};
const fts = d=>`${d.getDate()} ${MON[d.getMonth()]}, ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const appIc = (id,cls="")=>{const a=APP[id]||{mono:id,color:"#7c7aa0",name:id};return `<span class="app-ic ${cls}" style="background:${a.color}" title="${esc(a.name)}">${a.mono}</span>`};
const avatar = e=>`<span class="avatar" style="background:${e.color}">${esc(initials(e.name))}</span>`;
const person = (e,sub)=>`<div class="person">${avatar(e)}<div style="min-width:0"><b>${esc(e.name)}</b><span>${esc(sub??e.email)}</span></div></div>`;
const SMILE = `<svg class="smile" viewBox="0 0 34 10" fill="none" aria-hidden="true"><path d="M2 2c4 5 9 6.5 15 6.5S28 7 32 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const head = (eyebrow,title,sub,actions="")=>`<div class="sec-head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${SMILE}${sub?`<p>${sub}</p>`:""}</div>${actions?`<div class="row">${actions}</div>`:""}</div>`;
const GRANT = {none:["Not started","p-mute"],provisioning:["Giving access","p-info p-busy"],active:["Active","p-ok"],failed:["Failed","p-bad"],revoking:["Removing","p-warn p-busy"],revoked:["Removed","p-mute"]};
const EMP = {onboarding:["Onboarding","p-info"],active:["Active","p-ok"],offboarding:["Offboarding","p-warn"],offboarded:["Offboarded","p-mute"]};
const gpill = s=>`<span class="pill ${(GRANT[s]||GRANT.none)[1]}">${(GRANT[s]||GRANT.none)[0]}</span>`;
function epill(e){
  if(e.status==="active" && e.lastDay) return `<span class="pill p-warn">Leaving ${esc(fdate(e.lastDay))}</span>`;
  return `<span class="pill ${EMP[e.status]?.[1]||"p-mute"}">${EMP[e.status]?.[0]||e.status}</span>`;
}
const failedOf = e=>Object.keys(e.grants).filter(k=>e.grants[k]==="failed");
function checklist(e){
  const phase = (e.status==="offboarding"||e.status==="offboarded")?"off":"on";
  const items = phase==="on" ? e.onTasks : e.offTasks;
  const auto = Object.keys(e.grants).map(id=>({t:(phase==="on"?"Give access: ":"Remove access: ")+(APP[id]?.name||id), done: phase==="on" ? e.grants[id]==="active" : e.grants[id]==="revoked", auto:true}));
  const manual = items.map((x,i)=>({...x,i}));
  return {phase, auto, manual, total:auto.length+manual.length, done:auto.filter(x=>x.done).length+manual.filter(x=>x.done).length};
}
function toast(msg){const l=$("#layer");const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;l.appendChild(t);setTimeout(()=>t.remove(),3600)}

function go(r,sel){
  S.route=r; if(sel!==undefined) S.sel=sel;
  const h="#"+(r==="employee"?"employees":r);
  if(location.hash!==h){ try{ history.replaceState(null,"",h) }catch(e){} }
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(NAV.some(n=>n[0]===h)){S.route=h;render();window.scrollTo(0,0)}});

const offlineBanner = ()=>{
  if(!S.loaded) return `<div class="banner">Loading from the HR backend… If this stays here, Claude may be waiting for you to allow the connection.</div>`;
  if(S.offline) return `<div class="banner">Not connected to the HR backend. Add the hr-automation server in Claude, then reload this page. No data is shown until then.</div>`;
  if(S.error) return `<div class="banner">${esc(S.error)}</div>`;
  return "";
};

  const f=S.af||{q:"",app:"",res:""};
  const rows=S.audit.filter(a=>(!f.q||(a.emp+a.action+a.actor).toLowerCase().includes(f.q.toLowerCase()))&&(!f.app||a.app===f.app)&&(!f.res||a.result===f.res));
  return `<section class="section">
  ${head("Compliance","Audit <span class=\"grad\">log.</span>","Every access change, who made it and whether it worked. Entries can't be edited or deleted.")}
  <div class="card"><div class="filters">
    <input class="input grow" id="af-q" placeholder="Filter by person or action" value="${esc(f.q)}" aria-label="Filter by person or action">
    <select class="input" id="af-app" aria-label="Tool"><option value="">All tools</option>${APPS.map(a=>`<option value="${a.id}" ${f.app===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select>
    <select class="input" id="af-res" aria-label="Result"><option value="">All results</option><option value="ok" ${f.res==="ok"?"selected":""}>Succeeded</option><option value="fail" ${f.res==="fail"?"selected":""}>Failed</option><option value="info" ${f.res==="info"?"selected":""}>Info</option></select>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>When</th><th>Employee</th><th>Tool</th><th>Action</th><th class="hide-sm">By</th><th>Result</th></tr></thead><tbody>
  ${rows.length?rows.map(a=>`<tr><td class="num-cell mono">${fts(a.ts)}</td><td style="white-space:nowrap">${esc(a.emp)}</td><td>${a.app?`<div class="person">${appIc(a.app)}<span class="hide-sm" style="font-size:14px;color:var(--ink)">${esc(APP[a.app]?.name||a.app)}</span></div>`:`<span class="muted">—</span>`}</td><td style="min-width:200px">${esc(a.action)}</td><td class="hide-sm" style="white-space:nowrap">${esc(a.actor)}</td><td>${a.result==="fail"?'<span class="pill p-bad">Failed</span>':a.result==="info"?'<span class="pill p-warn">Info</span>':'<span class="pill p-ok">Done</span>'}</td></tr>`).join("")
  :`<tr><td colspan="6"><div class="empty">${S.loaded?"No entries match these filters.":"Loading…"}</div></td></tr>`}
  </tbody></table></div></div></section>`;
}

/* ---------- render ---------- */

const roleName = () => S.me && S.me.role === "admin" ? "HR admin" : S.me && S.me.role === "it" ? "IT admin" : "Employee, view only";

      <p class="muted" style="margin:14px 0 0;font-size:12.5px">Only @wohlig.com accounts can sign in. <button type="button" data-signup-on class="btn link" style="padding:0;font-size:12.5px">Create account</button></p>

function render(){
  document.body.classList.toggle("viewonly", !canEdit());
  if(S.loaded && !S.me){ $("#links").innerHTML=""; $("#view").innerHTML=vSignIn(); $("#who").innerHTML=""; return; }
  renderNav();
  if(!canEdit() && (S.route==="onboard" || S.route==="offboard")){ $("#view").innerHTML=`<section class="section"><div class="empty">Only HR and IT admins can make changes here. You can view the employee list and audit log.</div></section>`; return; }
  const v={dashboard:vDashboard,employees:vEmployees,employee:vEmployee,onboard:vOnboard,offboard:vOffboard,audit:vAudit}[S.route]||vDashboard;
  $("#view").innerHTML=v();
}

/* ---------- actions ---------- */
async function provision(id){
  await run("Access is being given. The list updates as each tool finishes.", ()=>call(TOOL.confirm,{employee_id:id}));
}
async function offboardNow(id, to, day){
  await run("Access removed. Finish the manual tasks to close it out.", ()=>call(TOOL.offboard,{employee_id:id,last_working_day:day||undefined,nominee:to||undefined}));
}
function askOffboard(id){
  const e=S.emps.find(x=>x.id===id); if(!e) return;
  const live=Object.keys(e.grants).filter(k=>e.grants[k]==="active"||e.grants[k]==="failed");
  const to=$("#o-to")?.value.trim()||"";
  const day=pickedDate("o-day");
  const l=$("#layer"); const d=document.createElement("div"); d.className="scrim";
  d.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="card-h" style="padding-top:24px"><h3>Offboard ${esc(e.name)} now?</h3></div><div class="card-b">
    <div class="callout bad">${"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M12 3 2 20h20z'/><path d='M12 10v4M12 17h.01'/></svg>"}<div>${esc(e.name.split(" ")[0])} will lose access to <b>${live.length} tools</b> right away. Their Drive files and email go to <b>${esc(to)}</b>.</div></div>
    <div class="chips">${live.map(id=>`<span class="chip">${appIc(id)}${esc(APP[id]?.name||id)}</span>`).join("")}</div>
    <div class="muted" style="font-size:13px">Every step is written to the audit log. The Google account is suspended first.</div></div>
    <div class="modal-f"><button class="btn glass" data-close>Cancel</button><button class="btn danger" data-ok>Yes, remove all access</button></div></div>`;
  l.appendChild(d);
  d.addEventListener("click",ev=>{
    if(ev.target===d||ev.target.closest("[data-close]")) { d.remove(); return; }
    if(ev.target.closest("[data-ok]")){ d.remove(); S.offSel=null; go("employee",id); offboardNow(id, to, day); }
  });
}

// Date fields are chosen from a calendar only. The chosen day is kept as YYYY-MM-DD in data-iso.
const pickedDate = (id) => (document.getElementById(id)?.dataset.iso) || "";
let CAL = null;
function closeCal(){ if(CAL){ CAL.el.remove(); CAL = null; } }
function openCal(id){
  const field = document.getElementById(id); if(!field) return;
  closeCal();
  const iso = pickedDate(id);
  const base = iso ? new Date(iso+"T00:00:00") : new Date();
  const el = document.createElement("div"); el.className = "cal-pop";
  el.addEventListener("click", ev => ev.stopPropagation());
  CAL = { el, id, y: base.getFullYear(), m: base.getMonth() };
  const draw = () => {
    const first = new Date(CAL.y, CAL.m, 1), startDow = first.getDay();
    const days = new Date(CAL.y, CAL.m+1, 0).getDate();
    const prevDays = new Date(CAL.y, CAL.m, 0).getDate();
    const todayIso = new Date().toISOString().slice(0,10);
    let cells = "";
    for(let i=0;i<42;i++){
      const dayNum = i - startDow + 1;
      let y=CAL.y, m=CAL.m, d=dayNum, muted=false;
      if(dayNum < 1){ m=CAL.m-1; d=prevDays+dayNum; muted=true; }
      else if(dayNum > days){ m=CAL.m+1; d=dayNum-days; muted=true; }
      const dt = new Date(y, m, d);
      const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
      cells += `<button type="button" class="cal-day${muted?" muted":""}${key===todayIso?" today":""}${key===iso?" sel":""}" data-pick="${key}">${dt.getDate()}</button>`;
    }
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const thisYear = new Date().getFullYear();
    const years = [];
    for(let y=thisYear-60; y<=thisYear+30; y++) years.push(y);
    if(!years.includes(CAL.y)) years.push(CAL.y);
    years.sort((a,b)=>a-b);
    el.innerHTML = `<div class="cal-head"><button type="button" class="cal-nav" data-cal-nav="-1" aria-label="Previous month">‹</button>
        <span class="cal-pick"><select class="cal-sel" data-cal-month aria-label="Month">${monthNames.map((n,i)=>`<option value="${i}"${i===CAL.m?" selected":""}>${n}</option>`).join("")}</select>
        <select class="cal-sel" data-cal-year aria-label="Year">${years.map(y=>`<option value="${y}"${y===CAL.y?" selected":""}>${y}</option>`).join("")}</select></span>
        <button type="button" class="cal-nav" data-cal-nav="1" aria-label="Next month">›</button></div>
      <div class="cal-grid">${["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=>`<span class="cal-dow">${d}</span>`).join("")}${cells}</div>`;
  };
  draw();
  el.addEventListener("change", ev => {
    if(ev.target.matches("[data-cal-month]")){ CAL.m = Number(ev.target.value); draw(); }
    if(ev.target.matches("[data-cal-year]")){ CAL.y = Number(ev.target.value); draw(); }
  });
  el.addEventListener("click", ev => {
    const nav = ev.target.closest("[data-cal-nav]");
    if(nav){ CAL.m += Number(nav.dataset.calNav); const d=new Date(CAL.y, CAL.m, 1); CAL.y=d.getFullYear(); CAL.m=d.getMonth(); draw(); return; }
    const pick = ev.target.closest("[data-pick]");
    if(pick){
      const [y,m,d] = pick.dataset.pick.split("-").map(Number);
      field.dataset.iso = pick.dataset.pick;
      field.value = fdate(pick.dataset.pick);
      closeCal();
    }
  });
  document.body.appendChild(el);
  const r = field.getBoundingClientRect();
  el.style.left = Math.max(12, Math.min(window.scrollX + r.left, window.scrollX + window.innerWidth - 300)) + "px";
  el.style.top = (window.scrollY + r.bottom + 8) + "px";
}
document.addEventListener("mousedown", ev => { if(CAL && !ev.target.closest(".cal-pop") && !ev.target.closest("[data-cal]")) closeCal(); });
const isDate = (el) => el && el.matches && el.matches('input[type="date"]');
document.addEventListener("keydown",ev=>{ if(isDate(ev.target) && ev.key!=="Tab") ev.preventDefault(); });
document.addEventListener("beforeinput",ev=>{ if(isDate(ev.target)) ev.preventDefault(); });
document.addEventListener("paste",ev=>{ if(isDate(ev.target)) ev.preventDefault(); });
document.addEventListener("click",ev=>{
  if(ev.target.closest("[data-signup-on]")){ ev.preventDefault(); S.signup=true; S.signupError=""; S.signinError=""; render(); return; }
  if(ev.target.closest("[data-signup-off]")){ ev.preventDefault(); S.signup=false; S.signupError=""; render(); return; }
  if(ev.target.closest("[data-google]")){ ev.preventDefault(); S.signinError = "Continue with Google is being set up. For now, sign in with your work email and password."; render(); return; }
  if(ev.target.closest("[data-logout]")){
    ev.preventDefault();
    const tok = getSession();
    setSession("");
    S.me = null; S.loggedIn = false; S.emps = []; S.audit = []; S.loaded = false; S.signinError = "";
    if(MCP && tok){ MCP.callTool(SERVER, "sign_out", { session: tok }).catch(()=>{}); }
    refresh(); return;
  }
  const cal=ev.target.closest("[data-cal]");
  if(cal){ ev.preventDefault(); openCal(cal.dataset.cal); return; }
  const t=ev.target.closest("[data-go],[data-emp],[data-retry],[data-provision],[data-offboard],[data-confirmoff],[data-schedule]"); if(!t) return;
  if(t.dataset.schedule){
    const id=Number(t.dataset.schedule); const day=pickedDate("o-day");
    if(!day){toast("Pick the last working day first.");return}
    run("Leaving date saved. Access is removed automatically on that day.", ()=>call(TOOL.schedule,{employee_id:id,last_working_day:day}));
    return;
  }
  if(t.dataset.go){ev.preventDefault();go(t.dataset.go);return}
  if(t.dataset.emp){go("employee",Number(t.dataset.emp));return}
  if(t.dataset.retry){provision(Number(t.dataset.retry));return}
  if(t.dataset.provision){provision(Number(t.dataset.provision));return}
  if(t.dataset.offboard){S.offSel=Number(t.dataset.offboard);go("offboard");return}
  if(t.dataset.confirmoff){askOffboard(Number(t.dataset.confirmoff));return}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.task){ run("Checklist saved.", ()=>call(TOOL.tick,{item_id:Number(t.dataset.task),done:t.checked})); return; }
  if(t.name==="offsel"){S.offSel=Number(t.value);render();return}
  if(t.id==="af-app"||t.id==="af-res"){S.af={q:$("#af-q").value,app:$("#af-app").value,res:$("#af-res").value};render();return}
});
function keepFocus(id){const n=$("#"+id);const pos=n.selectionStart;return()=>{const m=$("#"+id);if(m){m.focus();m.setSelectionRange(pos,pos)}}}
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="af-q"){S.af={q:t.value,app:$("#af-app").value,res:$("#af-res").value};const r=keepFocus("af-q");render();r()}
  if(t.id==="q"){S.q=t.value;const r=keepFocus("q");render();r()}
});
document.addEventListener("submit",async ev=>{
  if(ev.target.id==="signup"){
    ev.preventDefault();
    const email=$("#su-email").value.trim(), p1=$("#su-pass").value, p2=$("#su-pass2").value;
    if(!email){ S.signupError="Enter your work email."; render(); return; }
    const pwProblem = (p)=>{
      if(p.length<10) return "Password must be at least 10 characters.";
      if(!/[A-Z]/.test(p)) return "Password needs at least one uppercase letter (A-Z).";
      if(!/[a-z]/.test(p)) return "Password needs at least one lowercase letter (a-z).";
      if(!/[0-9]/.test(p)) return "Password needs at least one number (0-9).";
      if(!/[^A-Za-z0-9]/.test(p)) return "Password needs at least one special character, such as ! @ # $ % &.";
      return null;
    };
    const problem = pwProblem(p1);
    if(problem){ S.signupError=problem; render(); return; }
    if(p1!==p2){ S.signupError="The two passwords do not match."; render(); return; }
    try{
      await connect();
      if(!MCP) throw new Error("The HR backend is not connected. Open this page in the Claude desktop app.");
      await MCP.callTool(SERVER, "sign_up", { email, password: p1 });
      S.signup=false; S.signupError=""; S.signinError="Account created. Sign in with your email and password.";
      render();
    }catch(err){ S.signupError=userMessage(err); render(); }
    return;
  }
  if(ev.target.id==="signin"){
    ev.preventDefault();
    const email=$("#si-email").value.trim(), pass=$("#si-pass").value;
    if(!email||!pass){ S.signinError="Enter your email and password."; render(); return; }
    try{
      await connect();
      if(!MCP) throw new Error("The HR backend is not connected. Open this page in the Claude desktop app.");
      const role = $("#si-role").value;
      const r = await MCP.callTool(SERVER, "sign_in", { email, password: pass, role });
      const txt = (r.content||[]).find(c=>c.type==="text");
      const out = r.payload ?? (txt ? JSON.parse(txt.text) : null);
      if(!out || !out.session) throw new Error("Sign-in did not return a session.");
      setSession(out.session);
      S.signinError = "";
      S.loaded = false;
      await refresh();
    }catch(err){
      S.signinError = userMessage(err);
      render();
    }
    return;
  }
  if(ev.target.id!=="onf") return; ev.preventDefault();
  const name=$("#f-name").value.trim(), email=$("#f-email").value.trim().toLowerCase(), start=pickedDate("f-start");
  if(!name){toast("Add the employee's full name first.");return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast("Enter a valid work email.");return}
  if(!start){toast("Pick the start date.");return}
  run("Joiner added. Access is being given.", async ()=>{
    const emp = await call(TOOL.create,{full_name:name,work_email:email,department:$("#f-dept").value,job_title:$("#f-title").value.trim()||undefined,start_date:start});
    await call(TOOL.confirm,{employee_id:emp.id});
    S.sel=emp.id; S.route="employee";
  });
});

const h=location.hash.slice(1); if(NAV.some(n=>n[0]===h)) S.route=h;
render();
refresh();
})();
</script>
