# Render setup for the TEST environment (Singapore region, free plans). Created once from the repository.
# Free plans: the web service sleeps when idle (first load can be slow) and the free database expires after 30 days. Test data only.
# Test data only: do not load the real employee roster here until IT has approved the region.
services:
  - type: web
    name: hr-automation-test
    runtime: docker
    region: singapore
    rootDir: hr-automation/server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hr-automation-db-test
          property: connectionString

  # The daily offboarding job is not on Render's free plan. It will run from a free scheduler (GitHub Actions) in a later step.

databases:
  - name: hr-automation-db-test
    region: singapore
    plan: free
